<script>

    let currentUser = null;

    let currentTab = 'songs', selectedListId = null, listsViewMode = 'grid';
    let sortableInstance = null, metronomeInterval = null, adminVisible = false;
    let isAdminUser = false;
    const keys = ["C","Cm","C#","C#m","D","Dm","D#","D#m","E","Em","F","Fm","F#","F#m","G","Gm","G#","G#m","A","Am","A#","A#m","B","Bm"];
    const noteMap = { 'C':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,'F':5,'F#':6,'Gb':6,'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,'B':11 };
    const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    let cifraCurrentSong = null;

    // ==================== FUNCIONES AUXILIARES ====================
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' })[m]); }
    function closeModal() { document.getElementById('modal')?.remove(); }
    function showModal(content) { const div = document.createElement('div'); div.id = 'modal'; div.className = 'modal'; div.style.display = 'flex'; div.innerHTML = `<div class="modal-content">${content}</div>`; document.body.appendChild(div); }
    function dataURLtoBlob(dataURL) { const arr = dataURL.split(','); const mime = arr[0].match(/:(.*?);/)[1]; const bstr = atob(arr[1]); let n = bstr.length; const u8arr = new Uint8Array(n); while (n--) u8arr[n] = bstr.charCodeAt(n); return new Blob([u8arr], {type: mime}); }
    function generateUniqueId() { if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID(); return Date.now() + '-' + Math.random().toString(36).substr(2, 9); }

    function transposeChord(chord, semitones) {
        const match = chord.match(/^([A-G][#b]?)(.*)$/);
        if (!match) return chord;
        let base = match[1], suffix = match[2];
        let idx = noteMap[base];
        if (idx === undefined) return chord;
        let newIdx = (idx + semitones + 12) % 12;
        return noteNames[newIdx] + suffix;
    }
    function transposeLyrics(text, fromKey, toKey) {
        if (!text || !fromKey || !toKey || fromKey === toKey) return text;
        const fromBase = fromKey.replace(/m$/, ''), toBase = toKey.replace(/m$/, '');
        let semitones = (noteMap[toBase] - noteMap[fromBase] + 12) % 12;
        if (fromKey.endsWith('m')) semitones = (semitones + 12) % 12;
        if (toKey.endsWith('m') && !fromKey.endsWith('m')) semitones = (semitones + 12) % 12;
        return text.replace(/\[([A-G][#b]?[^\]]*)\]/g, (match, chord) => `[${transposeChord(chord, semitones)}]`);
    }

   function convertSpacedChordsToBrackets(text) {
    const lines = text.split('\n');
    const result = [];
    let i = 0;
    while (i < lines.length) {
        let line = lines[i];
        if (line.trim() === '') { result.push(line); i++; continue; }
        // Si la línea actual parece una línea de acordes (sin vocales)
        if (/^[\sA-Ga-g0-9#b\/]+$/.test(line) && !/[aeiouáéíóú]/i.test(line) && i+1 < lines.length) {
            const chords = line.trim().split(/\s+/);
            const lyricLine = lines[i+1];
            const words = lyricLine.split(/(\s+)/);
            let newLine = '';
            let chordIndex = 0;
            for (let word of words) {
                if (word.trim() !== '' && chordIndex < chords.length) {
                    newLine += `[${chords[chordIndex]}]${word}`;
                    chordIndex++;
                } else {
                    newLine += word;
                }
            }
            result.push(newLine);
            i += 2;
        } else {
            result.push(line);
            i++;
        }
    }
    return result.join('\n');
}

   function renderChordsOverLyrics(text) {
    if (!text) return '<p style="color:#64748b; text-align:center;">No hay letra disponible.</p>';
    
    const lines = text.split('\n');
    let html = '';
    let i = 0;
    
    while (i < lines.length) {
        let line = lines[i];
        if (line.trim() === '') { i++; continue; }
        
        // Detectar si la línea actual es solo acordes (sin vocales, solo letras de acordes y espacios)
        const isChordLine = /^[\sA-Ga-g0-9#b\/]+$/.test(line) && !/[aeiouáéíóú]/i.test(line);
        
        if (isChordLine && i + 1 < lines.length) {
            // Formato acordes arriba, letra abajo
            const chordLine = line.trim().split(/\s+/);
            const lyricLine = lines[i+1].trim();
            
            // Dividir la letra en palabras (manteniendo espacios)
            const words = lyricLine.split(/(\s+)/);
            // Reconstruir con acordes alineados
            let chordHtml = '<div class="chord-line">';
            let lyricHtml = '<div class="lyric-line">';
            let wordIndex = 0;
            
            for (let chord of chordLine) {
                if (wordIndex >= words.length) break;
                let word = words[wordIndex];
                // Mostrar acorde encima de la palabra
                chordHtml += `<span class="chord-item" style="min-width: ${Math.max(word.length * 0.8, 2)}rem;">${escapeHtml(chord)}</span>`;
                lyricHtml += `<span class="lyric-item" style="min-width: ${Math.max(word.length * 0.8, 2)}rem;">${escapeHtml(word)}</span>`;
                wordIndex++;
            }
            // Agregar el resto de palabras sin acorde
            while (wordIndex < words.length) {
                lyricHtml += `<span class="lyric-item">${escapeHtml(words[wordIndex])}</span>`;
                chordHtml += `<span class="chord-item" style="visibility:hidden;">&nbsp;</span>`;
                wordIndex++;
            }
            chordHtml += '</div>';
            lyricHtml += '</div>';
            html += `<div class="song-line">${chordHtml}${lyricHtml}</div>`;
            i += 2;
        } else {
            // Formato normal con [Acorde]texto o texto plano
            // Buscar patrones [Acorde]texto
            const parts = [];
            const regex = /\[([^\]]+)\]([^[]*)/g;
            let match;
            let lastIndex = 0;
            let hasChord = false;
            while ((match = regex.exec(line)) !== null) {
                hasChord = true;
                parts.push({ chord: match[1], text: match[2] });
                lastIndex = match.index + match[0].length;
            }
            if (!hasChord) {
                // Línea sin acordes, mostrar como texto simple
                html += `<div class="song-line"><div class="lyric-line">${escapeHtml(line)}</div></div>`;
                i++;
                continue;
            }
            // Construir visual con acordes encima de texto
            let chordHtml = '<div class="chord-line">';
            let lyricHtml = '<div class="lyric-line">';
            for (let part of parts) {
                let textLen = part.text.length;
                let width = Math.max(textLen * 0.8, 1) + 'rem';
                chordHtml += `<span class="chord-item" style="min-width:${width};">${escapeHtml(part.chord)}</span>`;
                lyricHtml += `<span class="lyric-item" style="min-width:${width};">${escapeHtml(part.text)}</span>`;
            }
            chordHtml += '</div>';
            lyricHtml += '</div>';
            html += `<div class="song-line">${chordHtml}${lyricHtml}</div>`;
            i++;
        }
    }
    return html;
}

    async function saveSong(song) {
    if (!isAdminUser) { alert("Solo administrador puede editar canciones."); return false; }
    try {
        // Mapear a los nombres reales de las columnas en Supabase (snake_case)
        const cleanSong = {
            id: song.id || generateUniqueId(),
            user_id: currentUser.id,
            title: song.title || "Sin título",
            category: song.category || "Adoración",
            key: song.key || "C",
            bpm: parseInt(song.bpm) || 80,
            chords_url: song.chordsUrl || "",   // ← importante: snake_case
            chords_data: song.chordsData || "", // ← importante: snake_case
            lyrics: song.lyrics || "",
            youtube: song.youtube || ""
        };
        
        const { error } = await supabaseClient
            .from('canciones')
            .upsert(cleanSong, { onConflict: 'id' });
            
        if (error) throw error;
        
        await loadUserData();
        renderCurrentView();
        return true;
    } catch (err) { 
        console.error(err); 
        alert("Error al guardar: " + err.message); 
        return false;
    }
}

        startBtn.onclick = () => { if (!isRunning) { isRunning = true; tick(); metronomeInterval = setInterval(() => { if (isRunning) tick(); }, intervalMs); } };

    function openTuner() {
        showModal(`<div class="tuner-container"><h3>Afinador</h3><div class="tuner-note" id="tunerNote">--</div><div class="tuner-meter"><div class="tuner-needle" id="tunerNeedle"></div></div><p>Reproduce una nota</p><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button></div>`);
        const noteElem = document.getElementById('tunerNote'); const needleElem = document.getElementById('tunerNeedle');
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { noteElem.innerText = "Sin micrófono"; return; }
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaStreamSource(stream);
            const analyser = audioCtx.createAnalyser(); analyser.fftSize = 2048; source.connect(analyser);
            const bufferLength = analyser.frequencyBinCount; const dataArray = new Float32Array(bufferLength);
            const detectPitch = () => {
                if(!document.getElementById('tunerNote')) return;
                analyser.getFloatTimeDomainData(dataArray);
                let maxSample = 0;
                for (let i=0; i<bufferLength; i++) if (Math.abs(dataArray[i]) > maxSample) maxSample = Math.abs(dataArray[i]);
                if (maxSample < 0.01) { requestAnimationFrame(detectPitch); return; }
                let autocorr = new Array(bufferLength);
                for (let lag=0; lag<bufferLength; lag++) {
                    let sum=0;
                    for (let i=0; i<bufferLength-lag; i++) sum += dataArray[i]*dataArray[i+lag];
                    autocorr[lag]=sum;
                }
                let maxVal=-1, maxLag=0;
                for (let lag=20; lag<bufferLength/2; lag++) if (autocorr[lag] > maxVal) { maxVal=autocorr[lag]; maxLag=lag; }
                let freq = audioCtx.sampleRate / maxLag;
                let noteNum = 12 * Math.log2(freq / 440) + 69;
                let roundedNote = Math.round(noteNum);
                let cents = Math.round((noteNum - roundedNote) * 100);
                let note = noteNames[roundedNote % 12];
                if (freq > 50 && freq < 600) {
                    noteElem.innerText = `${note} (${cents>0?'+':''}${cents}¢)`;
                    let percent = Math.min(100, Math.max(0, 50 + (cents/50)*50));
                    needleElem.style.width = `${percent}%`;
                    needleElem.style.background = Math.abs(cents) < 5 ? "#10B981" : "#F59E0B";
                } else { noteElem.innerText = "--"; needleElem.style.width = "0%"; }
                requestAnimationFrame(detectPitch);
            };
            detectPitch();
        }).catch(() => { if(noteElem) noteElem.innerText = "Permiso denegado"; });
    }

    async function startExam(examenId) {
        const { data: existing } = await supabaseClient.from('intentos_examen').select('*').eq('user_id', currentUser.id).eq('examen_id', examenId).single();
        if (existing) { alert("Ya completaste este examen."); return; }
        const qs = preguntas.filter(q => q.examen_id === examenId).sort((a,b)=>a.orden_index-b.orden_index);
        if (qs.length === 0) { alert("Este examen no tiene preguntas."); return; }
        examQuestions = qs; examCurrentIndex = 0; examScore = 0; currentExamId = examenId;
        document.getElementById('examOverlay').style.display = 'block';
        loadExamQuestion();
    }
    function loadExamQuestion() {
    if (examCurrentIndex >= examQuestions.length) { finishExam(); return; }
    const q = examQuestions[examCurrentIndex];
    document.getElementById('examProgressTitle').innerText = `Pregunta ${examCurrentIndex+1} de ${examQuestions.length}`;
    document.getElementById('examQuestionText').innerText = q.enunciado;
    // Determinar opciones según tipo
    let optionsHtml = '';
    if (q.tipo === 'vf') {
        optionsHtml = `
            <button class="option-btn" onclick="selectExamOption('Verdadero', this)"><strong>Verdadero</strong></button>
            <button class="option-btn" onclick="selectExamOption('Falso', this)"><strong>Falso</strong></button>
        `;
    } else if (q.tipo === 'completar') {
        optionsHtml = `<input type="text" id="completarInput" class="form-control" placeholder="Escribe tu respuesta"><button class="btn btn-primary" onclick="submitCompletar()">Responder</button>`;
        window.submitCompletar = () => {
            const respuesta = document.getElementById('completarInput').value.trim();
            if (respuesta.toLowerCase() === q.opcion_correcta.toLowerCase()) examScore++;
            examCurrentIndex++;
            loadExamQuestion();
        };
    } else {
        optionsHtml = `
            <button class="option-btn" onclick="selectExamOption('A', this)"><strong>A.</strong> ${escapeHtml(q.opcion_a)}</button>
            <button class="option-btn" onclick="selectExamOption('B', this)"><strong>B.</strong> ${escapeHtml(q.opcion_b)}</button>
            <button class="option-btn" onclick="selectExamOption('C', this)"><strong>C.</strong> ${escapeHtml(q.opcion_c)}</button>
            <button class="option-btn" onclick="selectExamOption('D', this)"><strong>D.</strong> ${escapeHtml(q.opcion_d)}</button>
        `;
    }
    document.getElementById('examOptionsContainer').innerHTML = optionsHtml;
    selectedOption = null;
    const timeLimit = q.tiempo_segundos || 15;
    examTimeLeft = timeLimit;
    document.getElementById('examTimerDisplay').innerText = `${examTimeLeft}s`;
    document.getElementById('timerBarFill').style.width = '100%';
    if (examTimer) clearInterval(examTimer);
    examTimer = setInterval(() => {
        examTimeLeft--;
        document.getElementById('examTimerDisplay').innerText = `${examTimeLeft}s`;
        document.getElementById('timerBarFill').style.width = `${(examTimeLeft/timeLimit)*100}%`;
        if (examTimeLeft <= 0) { clearInterval(examTimer); submitSelectedAnswer(); }
    }, 1000);
    window.selectExamOption = (letter, element) => {
        selectedOption = letter;
        document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
        element.classList.add('selected');
    };
    window.submitSelectedAnswer = () => {
        clearInterval(examTimer);
        const currentQ = examQuestions[examCurrentIndex];
        if (selectedOption && selectedOption === currentQ.opcion_correcta) examScore++;
        examCurrentIndex++;
        loadExamQuestion();
    };
}
    async function finishExam() {
        let finalScore = (examScore / examQuestions.length) * 20;
        await supabaseClient.from('intentos_examen').insert([{ user_id: currentUser.id, examen_id: currentExamId, puntaje: finalScore.toFixed(2) }]);
        alert(`Examen finalizado. Puntaje: ${finalScore.toFixed(2)} / 20`);
        document.getElementById('examOverlay').style.display = 'none';
        await loadUserData(); renderMoodle();
    }
    function closeExam() {
    if (examTimer) clearInterval(examTimer);
    document.getElementById('examOverlay').style.display = 'none';
}

function saveNewQuestion() {
    const enunciado = document.getElementById('qEnunciado').value.trim();
    if (!enunciado) return alert("Enunciado requerido");
    const tipo = document.getElementById('qTipo').value;
    const tiempo = parseInt(document.getElementById('qTiempo').value) || 15;
    let opcion_a = '', opcion_b = '', opcion_c = '', opcion_d = '', opcion_correcta = '';
    if (tipo === 'multiple') {
        opcion_a = document.getElementById('opA').value;
        opcion_b = document.getElementById('opB').value;
        opcion_c = document.getElementById('opC').value;
        opcion_d = document.getElementById('opD').value;
        opcion_correcta = document.getElementById('respCorrecta').value;
    } else if (tipo === 'vf') {
        opcion_correcta = document.getElementById('respCorrectaVF').value === 'Verdadero' ? 'V' : 'F';
        // Para mostrar en el examen, podemos poner las opciones como "Verdadero" y "Falso"
        opcion_a = 'Verdadero';
        opcion_b = 'Falso';
    } else if (tipo === 'completar') {
        opcion_correcta = document.getElementById('respCompletar').value.trim();
    }
    tempQuestions.push({
        id: null,
        enunciado,
        tipo,
        opcion_a, opcion_b, opcion_c, opcion_d,
        opcion_correcta,
        tiempo_segundos: tiempo,
        orden_index: tempQuestions.length
    });
    closeModal();
    renderQuestionBuilder(currentExamId); // necesitamos almacenar examId global
}

let currentExamId = null;

async function saveAllQuestions(examId) {
    currentExamId = examId;
    // Primero eliminar todas las preguntas actuales de ese examen
    await supabaseClient.from('preguntas').delete().eq('examen_id', examId);
    // Insertar las nuevas
    for (let i=0; i<tempQuestions.length; i++) {
        const q = tempQuestions[i];
        await supabaseClient.from('preguntas').insert({
            id: generateUniqueId(),
            examen_id: examId,
            enunciado: q.enunciado,
            tipo: q.tipo || 'multiple',
            opcion_a: q.opcion_a || '',
            opcion_b: q.opcion_b || '',
            opcion_c: q.opcion_c || '',
            opcion_d: q.opcion_d || '',
            opcion_correcta: q.opcion_correcta,
            tiempo_segundos: q.tiempo_segundos,
            orden_index: i
        });
    }
    await loadUserData();
    alert("Preguntas guardadas");
    closeModal();
    adminExams();
}

    // ==================== VISOR CIFRA ====================
   function openCifraViewer(songId, index) {
    currentSongIndex = index;
    const song = songs.find(s => s.id === songId);
    if (!song) return;
    cifraCurrentSong = song;
    cifraOriginalLyrics = song.lyrics || "";
    // Inicializar shift en 0 porque la canción ya tiene su tono base
    cifraSemitonesShift = 0;
    document.getElementById('cifraModalTitle').innerText = song.title;
    document.getElementById('cifraModalArtist').innerText = song.category;
    document.getElementById('currentToneDisplay').innerText = song.key;
    document.getElementById('cifraBpmInput').value = song.bpm || 80;
        if (cifraScrollInterval) clearInterval(cifraScrollInterval);
        cifraScrollInterval = null;
        document.getElementById('btnAutoScrollToggle').innerHTML = `<i class="fa-solid fa-play"></i> Play`;
        document.getElementById('cifraBodyContainer').scrollTop = 0;
        if (cifraMetroInterval) clearInterval(cifraMetroInterval);
        cifraMetroRunning = false;
        document.getElementById('btnMetronomeToggle').innerHTML = `<i class="fa-solid fa-drum"></i> Iniciar`;
        document.getElementById('metronomeVisualDot').classList.remove('pulse');
        cifraFontSize = 18;
        document.getElementById('cifraContentWrapper').style.fontSize = cifraFontSize + 'px';
        renderCifraContent();
        document.getElementById('cifraClubModal').style.display = 'flex';
    }
    function closeCifraViewer() {
        if (cifraScrollInterval) clearInterval(cifraScrollInterval);
        if (cifraMetroInterval) clearInterval(cifraMetroInterval);
        document.getElementById('cifraClubModal').style.display = 'none';
    }
    function navigateSong(delta) {
        let newIndex = currentSongIndex + delta;
        if (newIndex < 0) newIndex = songs.length - 1;
        if (newIndex >= songs.length) newIndex = 0;
        const newSong = songs[newIndex];
        if (newSong) openCifraViewer(newSong.id, newIndex);
    }
    function getShiftedKey(origKey, shift) {
        if (!origKey) return 'C';
        const isMinor = origKey.endsWith('m');
        const base = origKey.replace(/m$/, '');
        let idx = noteMap[base];
        if (idx === undefined) return origKey;
        let newIdx = (idx + shift + 12) % 12;
        return noteNames[newIdx] + (isMinor ? 'm' : '');
    }
    function renderCifraContent() {
        let lyrics = cifraOriginalLyrics;
        if (cifraSemitonesShift !== 0) {
            let targetKey = getShiftedKey(cifraCurrentSong.key, cifraSemitonesShift);
            lyrics = transposeLyrics(cifraOriginalLyrics, cifraCurrentSong.key, targetKey);
        }
        let html = renderChordsOverLyrics(lyrics);
        document.getElementById('cifraContentWrapper').innerHTML = html;
    }
    function changeTone(direction) {
        cifraSemitonesShift += direction;
        document.getElementById('currentToneDisplay').innerText = getShiftedKey(cifraCurrentSong.key, cifraSemitonesShift);
        renderCifraContent();
    }
    function updateSongBpm() { if (cifraCurrentSong) cifraCurrentSong.bpm = parseInt(document.getElementById('cifraBpmInput').value) || 80; if (cifraMetroRunning) { toggleCifraMetronome(); toggleCifraMetronome(); } }
    function toggleCifraMetronome() {
        const dot = document.getElementById('metronomeVisualDot');
        const btn = document.getElementById('btnMetronomeToggle');
        if (cifraMetroRunning) {
            clearInterval(cifraMetroInterval); cifraMetroRunning = false;
            btn.innerHTML = `<i class="fa-solid fa-drum"></i> Iniciar`; dot.classList.remove('pulse');
        } else {
            cifraMetroRunning = true; btn.innerHTML = `<i class="fa-solid fa-pause"></i> Pausa`;
            let bpm = parseInt(document.getElementById('cifraBpmInput').value) || 80;
            cifraMetroInterval = setInterval(() => { dot.classList.add('pulse'); if (navigator.vibrate) navigator.vibrate(30); setTimeout(() => dot.classList.remove('pulse'), 90); }, 60000 / bpm);
        }
    }
    function toggleCifraAutoScroll() {
        const btn = document.getElementById('btnAutoScrollToggle');
        const container = document.getElementById('cifraBodyContainer');
        if (cifraScrollInterval) { clearInterval(cifraScrollInterval); cifraScrollInterval = null; btn.innerHTML = `<i class="fa-solid fa-play"></i> Play`; }
        else { btn.innerHTML = `<i class="fa-solid fa-pause"></i> Pausa`; cifraScrollInterval = setInterval(() => { container.scrollTop += 1; if (container.scrollTop >= (container.scrollHeight - container.clientHeight)) { clearInterval(cifraScrollInterval); cifraScrollInterval = null; btn.innerHTML = `<i class="fa-solid fa-play"></i> Play`; } }, cifraScrollSpeed); }
    }
    function adjustScrollSpeed(delta) { cifraScrollSpeed += delta; if (cifraScrollSpeed < 10) cifraScrollSpeed = 10; if (cifraScrollSpeed > 150) cifraScrollSpeed = 150; if (cifraScrollInterval) { toggleCifraAutoScroll(); toggleCifraAutoScroll(); } }
    function adjustCifraFontSize(delta) { cifraFontSize += delta; if (cifraFontSize < 12) cifraFontSize = 12; if (cifraFontSize > 36) cifraFontSize = 36; document.getElementById('cifraContentWrapper').style.fontSize = cifraFontSize + 'px'; }
    async function saveCifraStateToServer() {
        if (!cifraCurrentSong) return;
        if (!isAdminUser) { alert("Solo administrador puede guardar cambios permanentes."); return; }
        let finalKey = getShiftedKey(cifraCurrentSong.key, cifraSemitonesShift);
        let finalBpm = parseInt(document.getElementById('cifraBpmInput').value) || 80;
        cifraCurrentSong.key = finalKey; cifraCurrentSong.bpm = finalBpm;
        await saveSong(cifraCurrentSong);
        alert("¡Tono y BPM guardados!");
        cifraSemitonesShift = 0;
    }

    })();
