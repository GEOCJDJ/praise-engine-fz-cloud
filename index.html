// Cambiar un rasgo específico
window.cambiarRasgoAvatar = (rasgo, direccion) => {
    let propIdx = rasgo + 'Idx';
    let optionsArray;
    if (rasgo === 'hair') optionsArray = AVATAR_OPTIONS.hair;
    else if (rasgo === 'hairColor') optionsArray = AVATAR_OPTIONS.hairColor;
    else if (rasgo === 'skin') optionsArray = AVATAR_OPTIONS.skinColor;
    else if (rasgo === 'eyes') optionsArray = AVATAR_OPTIONS.eyes;
    else if (rasgo === 'mouth') optionsArray = AVATAR_OPTIONS.mouth;
    else if (rasgo === 'bg') optionsArray = AVATAR_OPTIONS.backgroundColor;
    else return;
    
    currentAvatarState[propIdx] = (currentAvatarState[propIdx] + direccion + optionsArray.length) % optionsArray.length;
    actualizarImagenAvatar();
};

// Generar configuración completamente aleatoria
window.randomizarAvatarCompleto = () => {
    currentAvatarState.hairIdx = Math.floor(Math.random() * AVATAR_OPTIONS.hair.length);
    currentAvatarState.hairColorIdx = Math.floor(Math.random() * AVATAR_OPTIONS.hairColor.length);
    currentAvatarState.skinIdx = Math.floor(Math.random() * AVATAR_OPTIONS.skinColor.length);
    currentAvatarState.eyesIdx = Math.floor(Math.random() * AVATAR_OPTIONS.eyes.length);
    currentAvatarState.mouthIdx = Math.floor(Math.random() * AVATAR_OPTIONS.mouth.length);
    currentAvatarState.bgIdx = Math.floor(Math.random() * AVATAR_OPTIONS.backgroundColor.length);
    currentAvatarState.seed = generarSeedAleatoria();
    actualizarImagenAvatar();
};

// Actualizar la imagen de vista previa
window.actualizarImagenAvatar = () => {
    const hair = AVATAR_OPTIONS.hair[currentAvatarState.hairIdx];
    const hairColor = AVATAR_OPTIONS.hairColor[currentAvatarState.hairColorIdx];
    const skinColor = AVATAR_OPTIONS.skinColor[currentAvatarState.skinIdx];
    const eyes = AVATAR_OPTIONS.eyes[currentAvatarState.eyesIdx];
    const mouth = AVATAR_OPTIONS.mouth[currentAvatarState.mouthIdx];
    const bg = AVATAR_OPTIONS.backgroundColor[currentAvatarState.bgIdx];
    const seed = currentAvatarState.seed;
    
    const url = `https://api.dicebear.com/7.x/adventurer/svg?seed=${seed}&hair=${hair}&hairColor=${hairColor}&skinColor=${skinColor}&eyes=${eyes}&mouth=${mouth}&backgroundColor=${bg}`;
    
    const imgElement = document.getElementById('liveAvatarPreview');
    if (imgElement) imgElement.src = url;
};

// Guardar el avatar en Supabase (campo avatar_url)
window.guardarAvatarEnSupabase = async () => {
    const avatarUrl = document.getElementById('liveAvatarPreview').src;
    const guardarBtn = document.activeElement; // el botón que llamó
    const originalText = guardarBtn.innerHTML;
    guardarBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';
    guardarBtn.disabled = true;
    
    try {
        const { error } = await supabaseClient
            .from('perfiles')
            .update({ avatar_url: avatarUrl })
            .eq('id', currentUser.id);
        
        if (error) throw error;
        
        // Actualizar variable global y recargar perfil
        if (currentProfile) currentProfile.avatar_url = avatarUrl;
        await loadProfile();  // recargar perfil para tener datos frescos
        showToast("✅ Avatar guardado con éxito", "success");
        closeModal();
        
        // Refrescar las vistas donde se muestre el avatar
        if (currentTab === 'profile') renderUserProfile();
        else if (currentTab === 'home') renderHome();
        
        // También actualizar el header si muestras avatar allí (lo haremos después)
        actualizarAvatarEnHeader();
        
    } catch (error) {
        console.error("Error guardando avatar:", error);
        showToast("❌ Error al guardar: " + error.message, "error");
    } finally {
        guardarBtn.innerHTML = originalText;
        guardarBtn.disabled = false;
    }
};

// Función para actualizar el avatar en el header (opcional)
function actualizarAvatarEnHeader() {
    const avatarContainer = document.querySelector('.user-info .avatar-display');
    if (avatarContainer && currentProfile?.avatar_url) {
        avatarContainer.innerHTML = `<img src="${currentProfile.avatar_url}" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid #C8972A;">`;
    }
}

// Función para obtener la mejor URL de avatar (avatar personalizado > foto real > default)
function getAvatarUrl(profile) {
    if (profile?.avatar_url) return profile.avatar_url;
    if (profile?.foto_url) return profile.foto_url;
    return 'https://api.dicebear.com/7.x/identicon/svg?seed=' + (profile?.id || 'default');
}

// ========== NUEVAS FUNCIONES PARA MÓDULO DE CUMPLEAÑOS ==========
async function checkAndShowBirthday() {
    if (!currentUser) return;
    // Obtener perfil completo con birth_date
    const { data: profile, error } = await supabaseClient
        .from('perfiles')
        .select('id, nombre, avatar_url, birth_date')
        .eq('id', currentUser.id)
        .single();
    if (error || !profile || !profile.birth_date) return;
    
    const hoy = new Date();
    const birth = new Date(profile.birth_date);
    const esCumple = birth.getDate() === hoy.getDate() && birth.getMonth() === hoy.getMonth();
    if (!esCumple) return;
    
    // Verificar si ya se mostró hoy (para no repetir al recargar)
    const ultimo = localStorage.getItem(`birthday_shown_${currentUser.id}`);
    const hoyStr = hoy.toISOString().slice(0,10);
    if (ultimo === hoyStr) return;
    localStorage.setItem(`birthday_shown_${currentUser.id}`, hoyStr);
    
    // Cargar mensajes del muro
    const { data: messages } = await supabaseClient
        .from('birthday_messages')
        .select('*, sender:perfiles!sender_id(nombre)')
        .eq('receiver_id', currentUser.id)
        .order('created_at', { ascending: false });
    
    const formattedMessages = (messages || []).map(m => ({
        sender: m.sender?.nombre || 'Alguien',
        text: m.message_text
    }));
    
    // Mensaje inspirador personalizado (puedes conectar a IA después)
    const aiMessage = `🎵 Que este nuevo año de vida esté lleno de acordes de alegría, armonía y bendiciones. Tu servicio en ${currentProfile?.rol_musical || 'el ministerio'} es un regalo para todos. ¡Disfruta tu día especial! 🎂✨`;
    
    triggerBirthdayExperience({
        name: profile.nombre,
        avatarUrl: profile.avatar_url || getAvatarUrl(profile),
        aiMessage: aiMessage
    }, formattedMessages);
}

function triggerBirthdayExperience(userData, messages) {
    document.getElementById('bday-user-name').innerText = userData.name;
    document.getElementById('bday-ai-message').innerText = userData.aiMessage;
    const avatarImg = document.getElementById('bday-avatar');
    if (userData.avatarUrl) avatarImg.src = userData.avatarUrl;
    else avatarImg.src = 'https://api.dicebear.com/7.x/identicon/svg?seed=' + userData.name;
    
    const wall = document.getElementById('bday-messages-wall');
    wall.innerHTML = '';
    if (messages.length === 0) {
        wall.innerHTML = '<div class="message-card">✨ Aún no hay mensajes. ¡Sé el primero en felicitar a este siervo de Dios!</div>';
    } else {
        messages.forEach(msg => {
            const card = document.createElement('div');
            card.className = 'message-card';
            card.innerHTML = `<strong>${escapeHtml(msg.sender)}</strong><br>“${escapeHtml(msg.text)}”`;
            wall.appendChild(card);
        });
    }
    
    const modal = document.getElementById('birthday-modal');
    modal.classList.add('active');
    // Confeti
    const duration = 3000;
    const end = Date.now() + duration;
    (function frame() {
        confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#FFD700', '#FF8C00', '#FFFFFF'] });
        confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#FFD700', '#FF8C00', '#FFFFFF'] });
        if (Date.now() < end) requestAnimationFrame(frame);
    }());
}

window.closeBirthdayModal = function() {
    const modal = document.getElementById('birthday-modal');
    modal.classList.remove('active');
};

window.addBirthdayMessageToCurrent = async function() {
    const textarea = document.getElementById('new-birthday-message');
    const mensaje = textarea.value.trim();
    if (!mensaje) return showToast('Escribe un mensaje antes de enviar', 'warning');
    const modal = document.getElementById('birthday-modal');
    const receiverId = currentUser?.id; // quien recibe es el cumpleañero
    if (!receiverId) return;
    const { error } = await supabaseClient.from('birthday_messages').insert({
        receiver_id: receiverId,
        sender_id: currentUser.id,
        message_text: mensaje
    });
    if (error) {
        showToast('Error al enviar mensaje: ' + error.message, 'error');
        return;
    }
    showToast('✅ Mensaje enviado con cariño', 'success');
    textarea.value = '';
    // Recargar mensajes
    const { data: messages } = await supabaseClient
        .from('birthday_messages')
        .select('*, sender:perfiles!sender_id(nombre)')
        .eq('receiver_id', receiverId)
        .order('created_at', { ascending: false });
    const formatted = (messages || []).map(m => ({ sender: m.sender?.nombre || 'Alguien', text: m.message_text }));
    const wall = document.getElementById('bday-messages-wall');
    wall.innerHTML = formatted.map(msg => `<div class="message-card"><strong>${escapeHtml(msg.sender)}</strong><br>“${escapeHtml(msg.text)}”</div>`).join('');
};

async function loadMonthBirthdays() {
    const container = document.getElementById('month-birthdays-container');
    if (!container) return;
    // Llamar a la función SQL creada en Supabase
    const { data, error } = await supabaseClient.rpc('get_current_month_birthdays');
    if (error) {
        console.error('Error cargando cumpleañeros:', error);
        container.innerHTML = '<p class="text-muted">No se pudo cargar los cumpleaños.</p>';
        return;
    }
    if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-muted">🎂 No hay cumpleañeros este mes. ¡Sé el primero en registrar tu fecha!</p>';
        return;
    }
    container.innerHTML = data.map(b => `
        <div class="birthday-item">
            <img src="${b.avatar_url || 'https://api.dicebear.com/7.x/identicon/svg?seed=' + b.user_id}" class="birthday-avatar" alt="avatar">
            <div>
                <strong>${escapeHtml(b.full_name)}</strong>
                <span class="text-muted" style="font-size: 0.7rem;"> - Día ${b.day_of_month}</span>
            </div>
        </div>
    `).join('');
}

    
  // ==================== INICIALIZACIÓN DE LA APP (CORREGIDA) ====================
let appInicializada = false; // El semáforo que evita que la app choque consigo misma

(async () => {
    // 1. Aplicar tema visual guardado
    const savedTheme = localStorage.getItem('user_theme');
    if (savedTheme) aplicarTema(savedTheme);

    // 2. Función centralizada y blindada para arrancar la app
    const iniciarSesionCompleta = async (session) => {
        if (appInicializada) return; // Si ya arrancó, detenemos el doble choque
        appInicializada = true;

        currentUser = session.user;
        
        // A. Verificar si el perfil existe REALMENTE en Supabase (Crucial para Google)
        const { data: perfilDB } = await supabaseClient
            .from('perfiles')
            .select('id')
            .eq('id', currentUser.id)
            .maybeSingle();
        
        // B. Si es un usuario nuevo (Google o Email), le creamos su perfil oficial
        if (!perfilDB) {
            const nombreUsuario = currentUser.user_metadata?.full_name || currentUser.email;
            await supabaseClient.from('perfiles').insert([{
                id: currentUser.id,
                nombre: nombreUsuario,
                email: currentUser.email,
                rol: 'user' // Todos inician como usuarios normales
            }]);
        }

        // C. Cargar los datos del usuario y renderizar
        await loadProfile();
        await loadUserIglesia();
        await loadUserData();
renderApp();
setTimeout(() => checkAndShowBirthday(), 1000);
    };

    // 3. Escuchar cambios de Google, Inicio de sesión o Cierre de sesión
    supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_IN' && session) {
            iniciarSesionCompleta(session);
        } else if (event === 'SIGNED_OUT') {
            appInicializada = false; // Reseteamos el semáforo
            currentUser = null;
            currentIglesiaId = null;
            renderLogin();
        }
    });

    // 4. Verificación de sesión al recargar la página
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
        iniciarSesionCompleta(session);
    } else {
        renderLogin();
    }

    // 5. Motor de notificaciones en segundo plano
    setInterval(() => {
        if (currentUser && typeof cargarNotificaciones === 'function') {
            cargarNotificaciones();
        }
    }, 30000);
})();
