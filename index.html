const NOTE_TO_INDEX = {
    'C':0, 'C#':1, 'DB':1, 'D':2, 'D#':3, 'EB':3, 'E':4,
    'F':5, 'F#':6, 'GB':6, 'G':7, 'G#':8, 'AB':8, 'A':9,
    'A#':10, 'BB':10, 'B':11
};
const INDEX_TO_NOTE = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

function transposeChordName(chord, semitones) {
    // Separa raíz, modificadores (m,7, maj, etc.) y bajo (/E)
    const match = chord.match(/^([A-G][#b]?)(.*?)(\/([A-G][#b]?))?$/i);
    if (!match) return chord;
    let root = match[1];
    let suffix = match[2] || '';
    let slash = match[3] || '';
    let slashNote = match[4] || '';

    let idx = NOTE_TO_INDEX[root.toUpperCase()];
    if (idx === undefined) return chord;
    let newIdx = (idx + semitones + 12) % 12;
    let newRoot = INDEX_TO_NOTE[newIdx];
    if (slashNote) {
        let slashIdx = NOTE_TO_INDEX[slashNote.toUpperCase()];
        if (slashIdx !== undefined) {
            let newSlashIdx = (slashIdx + semitones + 12) % 12;
            slash = '/' + INDEX_TO_NOTE[newSlashIdx];
        }
    }
    return newRoot + suffix + slash;
}

function renderCifraFromText(content) {
    if (!content) {
        document.getElementById('cifraContentWrapper').innerHTML = '<p style="color:#64748b; text-align:center;">No hay letra disponible.</p>';
        return;
    }
    // Convertir a líneas
    const lines = content.split(/\r?\n/);
    const chordPattern = /\b([A-G][#b]?(?:m|maj|min|dim|sus|aug|add)?\d*(?:\/[A-G][#b]?)?)\b/gi;
    let html = '<pre style="font-family: \'Courier New\', Courier, monospace; white-space: pre-wrap; text-align: left; margin: 0; padding: 0; line-height: 1.6;">';
    for (let line of lines) {
        let coloredLine = line.replace(chordPattern, match => `<strong class="chord" style="color: #dc2626; font-weight: bold;">${match}</strong>`);
        html += coloredLine + '\n';
    }
    html += '</pre>';
    const wrapper = document.getElementById('cifraContentWrapper');
    wrapper.innerHTML = html;
    // Aplicar tamaño de letra guardado
    const preElem = wrapper.querySelector('pre');
    if (preElem) preElem.style.fontSize = cifraFontSize + 'px';
}

    function applyTransposition(offset) {
    if (!cifraOriginalContent) return;
    if (offset === 0) {
        renderCifraFromText(cifraOriginalContent);
        return;
    }
    const lines = cifraOriginalContent.split(/\r?\n/);
    // Expresión para detectar líneas que son SOLO acordes
    const chordLineRegex = /^[\s]*([A-G][#b]?(m|maj|min|dim|sus|aug|7M|M7|\d)*(\/[A-G][#b]?)?[\s,\.]*)+$/i;
    const tokenRegex = /([A-G][#b]?)([^/\s]*)(\/([A-G][#b]?))?/g;

    const transposedLines = lines.map(line => {
        if (chordLineRegex.test(line) && line.trim().length > 0) {
            // Línea de acordes: transponer cada token
            return line.replace(tokenRegex, (match, root, mod, slashPart, slashRoot) => {
                let newRoot = root;
                let idx = NOTE_TO_INDEX[root.toUpperCase()];
                if (idx !== undefined) {
                    let newIdx = (idx + offset + 12) % 12;
                    newRoot = INDEX_TO_NOTE[newIdx];
                }
                let newSlash = '';
                if (slashRoot) {
                    let sIdx = NOTE_TO_INDEX[slashRoot.toUpperCase()];
                    if (sIdx !== undefined) {
                        let newSIdx = (sIdx + offset + 12) % 12;
                        newSlash = '/' + INDEX_TO_NOTE[newSIdx];
                    }
                }
                return newRoot + (mod || '') + newSlash;
            });
        }
        // También transponer la línea "Tono: X" si existe
        if (line.toLowerCase().startsWith('tono:')) {
            return line.replace(/([A-G][#b]?)(m|maj|min)?/i, (match, root, mod) => {
                let idx = NOTE_TO_INDEX[root.toUpperCase()];
                if (idx !== undefined) {
                    let newIdx = (idx + offset + 12) % 12;
                    return INDEX_TO_NOTE[newIdx] + (mod || '');
                }
                return match;
            });
        }
        return line;
    });
    renderCifraFromText(transposedLines.join('\n'));
}

function transposeLyricsCompleto(text, fromKey, toKey) {
    if (!text || fromKey === toKey) return text;
    
    const lines = text.split('\n');
    const semitones = (noteMap[toKey.replace(/m$/, '')] - noteMap[fromKey.replace(/m$/, '')] + 12) % 12;
    
    const chordRegex = /\b([A-G][#b]?(?:m|maj|min|dim|sus|aug|add)?\d*(?:\/[A-G][#b]?)?)\b/gi;
    
    const transposedLines = lines.map(line => {
        const isChordLine = /^[\sA-Ga-g0-9#b\/]+$/.test(line) && !/[aeiouáéíóú]/i.test(line);
        if (isChordLine && line.trim().length > 0) {
            return line.replace(chordRegex, (match) => transposeChord(match, semitones));
        } else {
            // Línea de letra: también transponer acordes sueltos
            return line.replace(chordRegex, (match) => transposeChord(match, semitones));
        }
    });
    return transposedLines.join('\n');
}
function transposeCifra(steps) {
    if (!cifraOriginalContent) return;
    cifraCurrentOffset += steps;
    // Asegurar rango 0-11
    cifraCurrentOffset = ((cifraCurrentOffset % 12) + 12) % 12;
    // Mostrar la nueva tonalidad resultante
    let newKey = getShiftedKey(cifraCurrentSong.key, cifraCurrentOffset);
    document.getElementById('currentToneDisplay').innerText = newKey;
    applyTransposition(cifraCurrentOffset);
}

// Transpone directamente N semitonos desde el texto base (sin necesitar fromKey/toKey)
function transponeSemitonos(text, semitones) {
    if (!text || semitones === 0) return text;
    const semiNorm = ((semitones % 12) + 12) % 12;
    if (semiNorm === 0) return text;

    // Regex que captura la raíz del acorde + sufijo completo (incluye números como 7M, 9, 7, 7M, 7sus, etc.)
    // NO transpone palabras comunes (la, mi, re como pronombres) gracias al contexto de la línea
    const lines = text.split('\n');
    return lines.map(line => {
        // Detectar si es línea de acordes: sin vocales españolas y contiene notas
        const isChordLine = /^[\sA-Ga-g0-9#b\/\(\)]+$/.test(line) && !/[aeiouáéíóúü]/i.test(line);
        if (!isChordLine || line.trim().length === 0) return line;

        // Regex para acordes en línea de acordes: captura raíz + sufijo completo
        return line.replace(/\b([A-G][#b]?)((?:maj|min|dim|aug|sus|add|M)?(?:\d+)?(?:\/[A-G][#b]?)?)\b/g, (match, root, suffix) => {
            let idx = noteMap[root];
            if (idx === undefined) return match;
            let newIdx = (idx + semiNorm) % 12;
            return noteNames[newIdx] + suffix;
        });
    }).join('\n');
}

// Inicia o detiene el metrónomo visual (sin vibración)
function startMetronomeVisual(bpm) {
    if (cifraMetronomeInterval) clearInterval(cifraMetronomeInterval);
    const dot = document.getElementById('bpmDot');
    if (!dot) return;
    dot.classList.remove('beat');
    if (!isMetronomeRunning) return;   // no arrancar si no está activado
    if (!bpm || bpm <= 0) return;
    cifraMetronomeInterval = setInterval(() => {
        dot.classList.add('beat');
        setTimeout(() => dot.classList.remove('beat'), 150);
        // Si quieres vibración opcional, descomenta la siguiente línea
        // if (navigator.vibrate) navigator.vibrate(30);
    }, 60000 / bpm);
}

// Alterna el metrónomo (encendido/apagado)
function toggleMetronome() {
    const btn = document.getElementById('toggleMetronomeBtn');
    if (isMetronomeRunning) {
        // Detener
        if (cifraMetronomeInterval) {
            clearInterval(cifraMetronomeInterval);
            cifraMetronomeInterval = null;
        }
        isMetronomeRunning = false;
        btn.innerHTML = '<i class="fas fa-play"></i> Metro';
        // Apagar el puntito visual
        const dot = document.getElementById('bpmDot');
        if (dot) dot.classList.remove('beat');
    } else {
        // Iniciar
        isMetronomeRunning = true;
        const bpm = parseInt(document.getElementById('cifraBpmInput').value) || 80;
        startMetronomeVisual(bpm);
        btn.innerHTML = '<i class="fas fa-stop"></i> Parar';
    }
}

                btn.style.background = '#334155';

        }, msPerStep);

    if (newIndex >= songs.length) newIndex = 0;
    const newSong = songs[newIndex];
    if (newSong) openCifraViewer(newSong.id, newIndex);

function getShiftedKey(origKey, shift) {
    if (!origKey) return 'C';
    const isMinor = origKey.endsWith('m');
    const base = origKey.replace(/m$/, '');
    let idx = noteMap[base];
    if (idx === undefined) return origKey;
    let newIdx = (idx + shift + 12) % 12;
    let newBase = noteNames[newIdx];
    return newBase + (isMinor ? 'm' : '');
}

async function saveCifraStateToServer() {
    if (!cifraCurrentSong) return;
    if (!isAdminUser && !isIglesiaAdmin) {
        alert("Solo administrador puede guardar cambios permanentes.");
        return;
    }
    let finalKey = getShiftedKey(cifraCurrentSong.key, cifraCurrentOffset);
    let finalBpm = parseInt(document.getElementById('cifraBpmInput').value) || 80;
    let finalCapo = document.getElementById('cifraCapoInput').value;
    // Si hay offset, transpramos el original y lo guardamos como nuevo original
    if (cifraCurrentOffset !== 0) {
        const lines = cifraOriginalContent.split(/\r?\n/);
        const chordLineRegex = /^[\s]*([A-G][#b]?(m|maj|min|dim|sus|aug|7M|M7|\d)*(\/[A-G][#b]?)?[\s,\.]*)+$/i;
        const tokenRegex = /([A-G][#b]?)([^/\s]*)(\/([A-G][#b]?))?/g;
        const transposedLines = lines.map(line => {
            if (chordLineRegex.test(line)) {
                return line.replace(tokenRegex, (match, root, mod, slashPart, slashRoot) => {
                    let newRoot = root;
                    let idx = NOTE_TO_INDEX[root.toUpperCase()];
                    if (idx !== undefined) {
                        let newIdx = (idx + cifraCurrentOffset + 12) % 12;
                        newRoot = INDEX_TO_NOTE[newIdx];
                    }
                    let newSlash = '';
                    if (slashRoot) {
                        let sIdx = NOTE_TO_INDEX[slashRoot.toUpperCase()];
                        if (sIdx !== undefined) {
                            let newSIdx = (sIdx + cifraCurrentOffset + 12) % 12;
                            newSlash = '/' + INDEX_TO_NOTE[newSIdx];
                        }
                    }
                    return newRoot + (mod || '') + newSlash;
                });
            }
            return line;
        });
        cifraCurrentSong.lyrics = transposedLines.join('\n');
        cifraCurrentSong.key = finalKey;
    } else {
        cifraCurrentSong.lyrics = cifraOriginalContent;
        cifraCurrentSong.key = finalKey;
    }
    cifraCurrentSong.bpm = finalBpm;
    cifraCurrentSong.capo = finalCapo;
    await saveSong(cifraCurrentSong);
    // Después de guardar, resetear el original al contenido guardado y offset 0
    cifraOriginalContent = cifraCurrentSong.lyrics;
    cifraCurrentOffset = 0;
    document.getElementById('currentToneDisplay').innerText = finalKey;
    applyTransposition(0);
    alert("¡Canción actualizada con el nuevo tono, BPM y Capo!");
}

function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' })[m]); }
function closeModal() { document.getElementById('modal')?.remove(); }

function dataURLtoBlob(dataURL) { const arr = dataURL.split(','); const mime = arr[0].match(/:(.*?);/)[1]; const bstr = atob(arr[1]); let n = bstr.length; const u8arr = new Uint8Array(n); while (n--) u8arr[n] = bstr.charCodeAt(n); return new Blob([u8arr], {type: mime}); }
function generateUniqueId() { if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID(); return Date.now() + '-' + Math.random().toString(36).substr(2, 9); }
async function uploadFileToStorage(file, folder) { if (!file) return null; const fileExt = file.name.split('.').pop(); const fileName = `${folder}/${Date.now()}.${fileExt}`; const { data, error } = await supabaseClient.storage.from('lecciones').upload(fileName, file); if (error) throw error; const { data: { publicUrl } } = supabaseClient.storage.from('lecciones').getPublicUrl(fileName); return publicUrl; }
function transposeChord(chord, semitones) {
    // Separa la raíz (ej. C, C#, F) del resto (m, 7, maj7, /E, etc.)
    const match = chord.match(/^([A-G][#b]?)(.*)$/);
    if (!match) return chord;
    let base = match[1];
    let suffix = match[2];
    let idx = noteMap[base];
    if (idx === undefined) return chord;
    let newIdx = (idx + semitones + 12) % 12;
    let newBase = noteNames[newIdx];
    return newBase + suffix;
}
    function transposeLyrics(text, fromKey, toKey) { if (!text || !fromKey || !toKey || fromKey === toKey) return text; const fromBase = fromKey.replace(/m$/, ''), toBase = toKey.replace(/m$/, ''); let semitones = (noteMap[toBase] - noteMap[fromBase] + 12) % 12; if (fromKey.endsWith('m')) semitones = (semitones + 12) % 12; if (toKey.endsWith('m') && !fromKey.endsWith('m')) semitones = (semitones + 12) % 12; return text.replace(/\[([A-G][#b]?[^\]]*)\]/g, (match, chord) => `[${transposeChord(chord, semitones)}]`); }
function convertSpacedChordsToBrackets(text) { const lines = text.split('\n'); const result = []; let i = 0; while (i < lines.length) { let line = lines[i]; if (line.trim() === '') { result.push(line); i++; continue; } if (/^[\sA-Ga-g0-9#b\/]+$/.test(line) && !/[aeiouáéíóú]/i.test(line) && i+1 < lines.length) { const chords = line.trim().split(/\s+/); const lyricLine = lines[i+1]; const words = lyricLine.split(/(\s+)/); let newLine = ''; let chordIndex = 0; for (let word of words) { if (word.trim() !== '' && chordIndex < chords.length) { newLine += `[${chords[chordIndex]}]${word}`; chordIndex++; } else { newLine += word; } } result.push(newLine); i += 2; } else { result.push(line); i++; } } return result.join('\n'); }
function renderChordsOverLyrics(text) {
    if (!text) return '<p style="color:#64748b; text-align:center;">No hay letra disponible.</p>';
    
    let cleanText = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/&nbsp;/g, ' ');
    const lines = cleanText.split('\n');
    const chordRegex = /\b([A-G][#b]?(?:m|maj|min|dim|sus|aug|add)?\d*(?:\/[A-G][#b]?)?)\b/gi;
    let preContent = '';
    
    for (let line of lines) {
        if (line.trim() === '') {
            preContent += '\n';
            continue;
        }
        let coloredLine = line.replace(chordRegex, (match) => `<strong class="chord">${match}</strong>`);
        preContent += coloredLine + '\n';
    }
    
    // Eliminamos font-size fijo
    return `<pre style="font-family: 'Courier New', Courier, monospace; white-space: pre-wrap; text-align: left; margin: 0; padding: 0; line-height: 1.6;">${preContent}</pre>`;
}

                <input type="text" id="editKey" class="form-control" placeholder="Tonalidad" value="${key}" style="flex:1;">

            <div>

                <div style="margin-top:0.5rem;">
                    <label>Transponer:</label>
                    <button class="btn-icon" onclick="transposeNewSong(-1)">-½</button>

                    <button class="btn-icon" onclick="transposeNewSong(1)">+½</button>
                    <select id="transposeNewSongToKey" class="form-control" style="width:auto; display:inline-block;">
                        ${keys.map(k => `<option value="${k}">${k}</option>`).join('')}
                    </select>
                    <button class="btn btn-primary" onclick="applyNewSongTranspose()">Transponer</button>
                </div>
            </div>
            <div class="form-group">
                <label>Letra y acordes</label>
                <textarea id="newSongLyrics" rows="12" class="form-control" style="font-family: monospace;">${escapeHtml(lyrics)}</textarea>
            </div>

                <button class="btn btn-primary" onclick="saveNewSong()">Guardar</button>
            </div>
        </div>
    `;
    showModal(modalContent);

    // Funciones auxiliares para el modal de nueva canción
    window.showPreviewInNewSong = () => {
        const textarea = document.getElementById('newSongLyrics');
        const previewDiv = document.getElementById('newSongPreviewContent');
        const previewContainer = document.getElementById('newSongPreview');
        if (textarea && previewDiv) {
            previewDiv.innerHTML = renderChordsOverLyrics(textarea.value);
            previewContainer.style.display = 'block';
        }
    };
    window.transposeNewSong = (steps) => {
        const textarea = document.getElementById('newSongLyrics');
        const currentKeySpan = document.getElementById('newSongCurrentKey');
        if (!textarea || !currentKeySpan) return;
        let currentKey = currentKeySpan.innerText;
        let idx = keys.indexOf(currentKey);
        let newIdx = (idx + steps + keys.length) % keys.length;
        let newKey = keys[newIdx];
        textarea.value = transposeLyrics(textarea.value, currentKey, newKey);
        currentKeySpan.innerText = newKey;
        if (document.getElementById('newSongPreview').style.display === 'block') window.showPreviewInNewSong();
    };
    window.applyNewSongTranspose = () => {
        const textarea = document.getElementById('newSongLyrics');
        const toKey = document.getElementById('transposeNewSongToKey').value;
        const currentKeySpan = document.getElementById('newSongCurrentKey');
        if (!textarea || !currentKeySpan) return;
        let currentKey = currentKeySpan.innerText;
        textarea.value = transposeLyrics(textarea.value, currentKey, toKey);
        currentKeySpan.innerText = toKey;
        if (document.getElementById('newSongPreview').style.display === 'block') window.showPreviewInNewSong();
    };
    window.saveNewSong = async () => {
        const title = document.getElementById('editTitle').value.trim();
        if (!title) return alert("El título es requerido");

        const bpm = parseInt(document.getElementById('editBpm').value) || 80;

            title,
            category: artist || "Adoración",
            key,
            bpm,
            chordsUrl: '',
            chordsData: '',
            lyrics,
            youtube: '',
            capo
        };
        await saveSong(song);
        closeModal();
    };
}    
    async function saveSongFromModal(id) { if (!isAdminUser && !isIglesiaAdmin) return; const title = document.getElementById('mTitle').value.trim(); if (!title) return alert("Título requerido"); const category = document.getElementById('mCat').value; const key = document.getElementById('mKey').value; const bpm = parseInt(document.getElementById('mBpm').value) || 80; const chordsUrl = document.getElementById('mChordsUrl').value.trim(); const lyrics = document.getElementById('mLyrics').value; let chordsData = ''; const file = document.getElementById('mChordsFile').files[0]; if (file) { const reader = new FileReader(); await new Promise(resolve => { reader.onload = e => { chordsData = e.target.result; resolve(); }; reader.readAsDataURL(file); }); } else if (id) { const existingSong = songs.find(s=>s.id===id); if (existingSong) chordsData = existingSong.chordsData || ''; } const song = { id: id || generateUniqueId(), title, category, key, bpm, chordsUrl, chordsData, lyrics, youtube: '' }; await saveSong(song); closeModal(); }
    
    function openMetronome(songId) { const song = songs.find(s=>s.id===songId); if(!song) return; const bpm = song.bpm||80; const intervalMs = 60000/bpm; if(metronomeInterval) clearInterval(metronomeInterval); showModal(`<div style="text-align:center"><h3>Metrónomo: ${escapeHtml(song.title)}</h3><div class="metronome-led" id="metroLed"></div><p style="font-size:1.5rem;">${bpm} BPM</p><button class="btn btn-primary" id="startMetroBtn">Iniciar</button><button class="btn btn-ghost" id="stopMetroBtn">Detener</button><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button></div>`); const led = document.getElementById('metroLed'), startBtn = document.getElementById('startMetroBtn'), stopBtn = document.getElementById('stopMetroBtn'); let isRunning = false; const tick = () => { led.style.background="#3B82F6"; if(navigator.vibrate) navigator.vibrate(40); setTimeout(()=>led.style.background="#475569",100); }; startBtn.onclick = () => { if(!isRunning) { isRunning=true; tick(); metronomeInterval = setInterval(()=>{ if(isRunning) tick(); }, intervalMs); } }; stopBtn.onclick = () => { if(metronomeInterval) clearInterval(metronomeInterval); isRunning=false; }; }
function viewChords(songId) { const song = songs.find(s=>s.id===songId); if(!song) return; let content = ''; if(song.chordsData) { const blob = dataURLtoBlob(song.chordsData); const url = URL.createObjectURL(blob); content = `<iframe src="${url}" style="width:100%;height:420px;border:none"></iframe><br><a href="${url}" download="acordes_${song.id}.pdf" class="btn btn-primary">Descargar Archivo</a>`; } else if(song.chordsUrl) { content = `<iframe src="${song.chordsUrl}" style="width:100%;height:420px;border:none"></iframe><br><a href="${song.chordsUrl}" target="_blank" class="btn btn-primary">Abrir enlace</a>`; } else content = `<p>No hay archivos adjuntos.</p>`; showModal(`<h3>Acordes: ${escapeHtml(song.title)}</h3>${content}<div style="margin-top:1rem;"><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button></div>`); }

    function parseChoFile(content, filename) {
    const lines = content.split(/\r?\n/);
    let metadata = {
        title: filename.replace(/\.cho$/i, ''),
        artist: '',
        key: 'C',
        tempo: 80
    };
    
    let lyricsLines = [];
    
    for (let rawLine of lines) {
        let line = rawLine.trim();
        if (line === '') {
            lyricsLines.push('');
            continue;
        }

        // 1. Extraer Metadatos y Comentarios (Tags { })
        if (line.startsWith('{') && line.endsWith('}')) {
            const inner = line.slice(1, -1);
            const lowerInner = inner.toLowerCase();
            if (lowerInner.startsWith('title:')) metadata.title = inner.substring(6).trim();
            else if (lowerInner.startsWith('artist:')) metadata.artist = inner.substring(7).trim();
            else if (lowerInner.startsWith('key:')) metadata.key = inner.substring(4).trim();
            else if (lowerInner.startsWith('tempo:')) metadata.tempo = parseInt(inner.substring(6).trim()) || 80;
            else if (lowerInner.startsWith('c:')) {
                // Comentarios se muestran como texto
                const comment = inner.substring(2).trim();
                if (comment) lyricsLines.push(comment.toUpperCase());
            }
            continue;
        }

        // 2. Limpiar barras dobles de repetición '//'
        line = line.replace(/\/\//g, '').trim();
        if (line === '') continue;

        // 3. Separar Acordes arriba y Letra abajo
        if (line.includes('[')) {
            let chordLine = '';
            let textLine = '';
            let currentTextLength = 0;
            
            const regex = /([^\[]*)\[([^\]]+)\]/g;
            let match;
            let lastIndex = 0;

            while ((match = regex.exec(line)) !== null) {
                const textBeforeChord = match[1];
                const chord = match[2];
                
                textLine += textBeforeChord;
                currentTextLength += textBeforeChord.length;
                
                while (chordLine.length < currentTextLength) {
                    chordLine += ' ';
                }
                chordLine += chord;
                lastIndex = regex.lastIndex;
            }
            
            const remainingText = line.substring(lastIndex);
            textLine += remainingText;

            if (chordLine.trim() !== '') lyricsLines.push(chordLine);
            if (textLine.trim() !== '') lyricsLines.push(textLine);
        } else {
            // Línea sin acordes
            lyricsLines.push(line);
        }
    }

    return {
        selected: true,
        title: metadata.title,
        category: metadata.artist || 'Adoración',
        key: metadata.key,
        bpm: metadata.tempo,
        lyrics: lyricsLines.join('\n'),
        chordsData: '',
        chordsUrl: '',
        originalFilename: filename
    };
}

window.saveSelectedSongs = async (cancionesTemp) => { if(!isAdminUser && !isIglesiaAdmin) return alert("Solo administrador puede importar canciones."); const progressModal = document.createElement('div'); progressModal.id='importProgress'; progressModal.className='modal'; progressModal.style.display='flex'; progressModal.innerHTML=`<div class="modal-content" style="text-align:center;"><h3>Importando canciones...</h3><div style="width:100%;background:#ddd;border-radius:10px;margin:1rem 0;"><div id="progressBarFill" style="width:0%;height:20px;background:var(--primary);border-radius:10px;"></div></div><p id="progressStatus">Preparando...</p></div>`; document.body.appendChild(progressModal); let saved=0, errors=0, skipped=0; const totalToSave = cancionesTemp.filter((_,i)=>document.getElementById(`chk_${i}`)?.checked).length; for(let i=0;i<cancionesTemp.length;i++){ const chk=document.getElementById(`chk_${i}`); if(!chk||!chk.checked) continue; const title = document.getElementById(`title_${i}`).value.trim(); if(!title){ errors++; continue; } const exists = songs.some(s=>s.title.toLowerCase()===title.toLowerCase()); if(exists){ if(confirm(`La canción "${title}" ya existe. ¿Deseas sobrescribirla?`)){ const existingSong = songs.find(s=>s.title.toLowerCase()===title.toLowerCase()); if(existingSong){ const category = document.getElementById(`cat_${i}`).value; const key = document.getElementById(`key_${i}`).value; const bpm = parseInt(document.getElementById(`bpm_${i}`).value)||80; const lyrics = document.getElementById(`lyrics_${i}`).value; existingSong.title=title; existingSong.category=category; existingSong.key=key; existingSong.bpm=bpm; existingSong.lyrics=lyrics; await saveSong(existingSong); saved++; } else { const success = await saveSong(createSongObject(i,cancionesTemp)); if(success) saved++; else errors++; } } else { skipped++; } } else { const success = await saveSong(createSongObject(i,cancionesTemp)); if(success) saved++; else errors++; } const completed = saved+errors+skipped; const percent = (completed/totalToSave)*100; document.getElementById('progressBarFill').style.width=`${percent}%`; document.getElementById('progressStatus').innerText=`Procesando: ${completed} de ${totalToSave} (${saved} guardadas, ${errors} errores, ${skipped} omitidas)`; } setTimeout(()=>{ progressModal.remove(); alert(`Importación finalizada:\n✅ Guardadas: ${saved}\n❌ Errores: ${errors}\n⏭️ Omitidas: ${skipped}`); closeModal(); renderCurrentView(); },500); };
function createSongObject(index,cancionesTemp) { return { id:generateUniqueId(), title:document.getElementById(`title_${index}`).value.trim(), category:document.getElementById(`cat_${index}`).value, key:document.getElementById(`key_${index}`).value, bpm:parseInt(document.getElementById(`bpm_${index}`).value)||80, lyrics:document.getElementById(`lyrics_${index}`).value, chordsUrl:'', chordsData:'', youtube:'' }; }

async function viewMyShifts() {

leElem.style.width="0%"; } requestAnimationFrame(detectPitch); }; detectPitch(); }).catch(()=>{ if(noteElem) noteElem.innerText="Permiso denegado"; }); }

async function showEstadisticas() {
    try {
        const fechaLimite = new Date();
        fechaLimite.setDate(fechaLimite.getDate() - 30);
        const fechaStr = fechaLimite.toISOString();
        
        // Canciones más vistas (sin usar .group)
        const { data: cancionesData, error: songsError } = await supabaseClient
            .from('estadisticas_canciones')
            .select('song_id')
            .eq('fecha', '>=', fechaStr)
            .eq('iglesia_id', currentIglesiaId);
        
        // Contar manualmente
        const songCounts = {};
        if (cancionesData && !songsError) {
            cancionesData.forEach(item => {
                const songId = item.song_id;
                songCounts[songId] = (songCounts[songId] || 0) + 1;
            });
        }
        let topSongs = Object.entries(songCounts).map(([id, count]) => ({ song_id: id, count }));
        topSongs.sort((a,b) => b.count - a.count);
        topSongs = topSongs.slice(0, 5);
        
        // Listas más impresas
        const { data: listasData, error: listsError } = await supabaseClient
            .from('estadisticas_listas')
            .select('lista_id')
            .eq('fecha', '>=', fechaStr)
            .eq('iglesia_id', currentIglesiaId);
        
        const listCounts = {};
        if (listasData && !listsError) {
            listasData.forEach(item => {
                const listaId = item.lista_id;
                listCounts[listaId] = (listCounts[listaId] || 0) + 1;
            });
        }
        let topLists = Object.entries(listCounts).map(([id, count]) => ({ lista_id: id, count }));
        topLists.sort((a,b) => b.count - a.count);
        topLists = topLists.slice(0, 5);
        
        // Usuarios más activos
        const { data: usuariosData, error: usersError } = await supabaseClient
            .from('estadisticas_usuarios')
            .select('user_id')
            .eq('fecha', '>=', fechaStr)
            .eq('iglesia_id', currentIglesiaId);
        
        const userCounts = {};
        if (usuariosData && !usersError) {
            usuariosData.forEach(item => {
                const userId = item.user_id;
                userCounts[userId] = (userCounts[userId] || 0) + 1;
            });
        }
        let topUsers = Object.entries(userCounts).map(([id, count]) => ({ user_id: id, count }));
        topUsers.sort((a,b) => b.count - a.count);
        topUsers = topUsers.slice(0, 5);
        
        let html = `<h3>📈 Estadísticas de uso (últimos 30 días)</h3>
                    <div class="card"><h4>🎵 Canciones más vistas</h4><ul>`;
        if (topSongs.length) {
            for (let item of topSongs) {
                const song = songs.find(s => s.id === item.song_id);
                html += `<li><strong>${song ? escapeHtml(song.title) : 'Desconocida'}</strong> - ${item.count} vistas</li>`;
            }
        } else {
            html += `<li>Sin datos aún</li>`;
        }
        html += `</ul></div>
                 <div class="card"><h4>📄 Listas más impresas</h4><ul>`;
        if (topLists.length) {
            for (let item of topLists) {
                const lista = lists.find(l => l.id === item.lista_id);
                html += `<li><strong>${lista ? escapeHtml(lista.name) : 'Desconocida'}</strong> - ${item.count} impresiones</li>`;
            }
        } else {
            html += `<li>Sin datos aún</li>`;
        }
        html += `</ul></div>
                 <div class="card"><h4>👥 Usuarios más activos</h4><ul>`;
        if (topUsers.length) {
            for (let item of topUsers) {
                const { data: profile } = await supabaseClient.from('perfiles').select('nombre').eq('id', item.user_id).single();
                html += `<li><strong>${profile ? escapeHtml(profile.nombre) : 'Usuario'}</strong> - ${item.count} acciones</li>`;
            }
        } else {
            html += `<li>Sin datos aún</li>`;
        }
        html += `</ul></div>
                 <button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>`;
        
        showModal(html);
    } catch (error) {
        console.error("Error en estadísticas:", error);
        alert("Error al cargar estadísticas: " + error.message);
    }
}

// NUEVA FUNCIÓN: adminUserManagement con selector jerárquico (departamento padre + equipo hijo)
async function adminUserManagement() {
    if (!currentIglesiaId) {
        alert("Primero selecciona una iglesia en el panel de administración.");
        return;
    }

    // Obtener usuarios de la iglesia actual
    const { data: miembrosData, error } = await supabaseClient
        .from('usuarios_iglesia')
        .select('*, perfiles(nombre, email, rol)')
        .eq('iglesia_id', currentIglesiaId);
    if (error) return alert("Error: " + error.message);

    // Obtener el ID del departamento GENERAL
    const generalDepto = departamentos.find(d => d.nombre === 'GENERAL' && d.padre_id === null);
    if (!generalDepto) {
        alert("No se encontró el departamento GENERAL. Crea los departamentos primero.");
        return;
    }
    const generalId = generalDepto.id;

    // Áreas = departamentos cuyo padre_id es GENERAL (excluyendo al propio GENERAL)
    const areas = departamentos.filter(d => d.padre_id === generalId);
    // Equipos = departamentos que tienen padre_id distinto de null y distinto de generalId
    const equipos = departamentos.filter(d => d.padre_id !== null && d.padre_id !== generalId);
    // Mapa de equipos por área
    const equiposPorArea = {};
    equipos.forEach(e => {
        if (!equiposPorArea[e.padre_id]) equiposPorArea[e.padre_id] = [];
        equiposPorArea[e.padre_id].push(e);
    });

    let html = `<h3>📋 Gestión de Usuarios Registrados (${currentIglesiaData?.nombre})</h3>
                <div style="display:flex; flex-direction:column; gap:1rem;">`;

    for (let m of miembrosData) {
        const perfil = m.perfiles;
        const rolMusical = m.rol_musical || 'Por asignar';
        const deptoActual = m.departamento_id || '';
        // Determinar si el depto actual es un área o un equipo
        const deptoActualObj = departamentos.find(d => d.id === deptoActual);
        const esArea = deptoActualObj && deptoActualObj.padre_id === generalId;
        const esEquipo = deptoActualObj && deptoActualObj.padre_id !== null && deptoActualObj.padre_id !== generalId;
        const areaActual = esEquipo ? deptoActualObj.padre_id : (esArea ? deptoActual : '');
        const equipoActual = esEquipo ? deptoActual : '';
        const esAdminIglesia = m.es_admin_iglesia || false;
        const esAdminDepto = m.es_admin_departamento || false;

        html += `<div class="card" style="padding:1rem;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
                <div style="flex:1;">
                    <div class="form-group" style="margin:0;">
                        <label>Nombre completo</label>
                        <input type="text" id="nombre_${m.id}" class="form-control" value="${escapeHtml(perfil?.nombre || '')}" placeholder="Nombre del usuario">
                    </div>
                    <small>${escapeHtml(perfil?.email)}</small>
                </div>
                ${isAdminUser ? `<button class="btn-icon" onclick="deleteUserById('${m.user_id}')" style="color:red;" title="Eliminar usuario"><i class="fas fa-trash"></i></button>` : ''}
            </div>
            <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:0.8rem; margin-top:1rem;">
                <div class="form-group">
                    <label>Rol en app</label>
                    <select id="rol_${m.id}" class="form-control">
                        <option value="user" ${perfil?.rol === 'user' ? 'selected' : ''}>Usuario normal</option>
                        <option value="admin" ${perfil?.rol === 'admin' ? 'selected' : ''}>Administrador (global)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Departamento (Área)</label>
                    <select id="area_${m.id}" class="form-control" onchange="cargarEquipos('${m.id}')">
                        <option value="">Sin área</option>
                        ${areas.map(a => `<option value="${a.id}" ${areaActual === a.id ? 'selected' : ''}>${escapeHtml(a.nombre)}</option>`).join('')}
                    </select>
                </div>
                <div class="form-group">
                    <label>Equipo (Subdepartamento)</label>
                    <select id="equipo_${m.id}" class="form-control">
                        <option value="">Selecciona un equipo</option>
                        ${areaActual && equiposPorArea[areaActual] ? equiposPorArea[areaActual].map(e => `<option value="${e.id}" ${equipoActual === e.id ? 'selected' : ''}>${escapeHtml(e.nombre)}</option>`).join('') : ''}
                    </select>
                </div>
                <div class="form-group">
                    <label>Rol musical</label>
                    <select id="rolMusical_${m.id}" class="form-control">
                        <option value="">Sin rol</option>
                        <option value="Voz" ${rolMusical === 'Voz' ? 'selected' : ''}>Voz</option>
                        <option value="Batería" ${rolMusical === 'Batería' ? 'selected' : ''}>Batería</option>
                        <option value="Bajo" ${rolMusical === 'Bajo' ? 'selected' : ''}>Bajo</option>
                        <option value="Guitarra" ${rolMusical === 'Guitarra' ? 'selected' : ''}>Guitarra</option>
                        <option value="Teclado" ${rolMusical === 'Teclado' ? 'selected' : ''}>Teclado</option>
                        <option value="Percusión" ${rolMusical === 'Percusión' ? 'selected' : ''}>Percusión</option>
                        <option value="Otro" ${rolMusical === 'Otro' ? 'selected' : ''}>Otro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><input type="checkbox" id="adminIglesia_${m.id}" ${esAdminIglesia ? 'checked' : ''}> Administrador de iglesia</label>
                </div>
                <div class="form-group">
                    <label><input type="checkbox" id="adminDepto_${m.id}" ${esAdminDepto ? 'checked' : ''}> Administrador de departamento</label>
                </div>
            </div>
            <div style="margin-top:1rem; text-align:right;">
                <button class="btn btn-primary" onclick="updateUserByAdminNuevo('${m.id}', '${m.user_id}')">Guardar cambios</button>
            </div>
        </div>`;

        // Registrar función global para cargar equipos según el área seleccionada
        window[`cargarEquipos_${m.id}`] = function() {
            const areaId = document.getElementById(`area_${m.id}`).value;
            const equipoSelect = document.getElementById(`equipo_${m.id}`);
            if (!areaId) {
                equipoSelect.innerHTML = '<option value="">Selecciona un equipo</option>';
                return;
            }
            const equiposLista = equiposPorArea[areaId] || [];
            equipoSelect.innerHTML = '<option value="">Selecciona un equipo</option>' +
                equiposLista.map(e => `<option value="${e.id}">${escapeHtml(e.nombre)}</option>`).join('');
        };
    }
    html += `</div><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>`;
    showModal(html);

    // Adjuntar eventos onchange a los selectores de área
    for (let m of miembrosData) {
        const areaSelect = document.getElementById(`area_${m.id}`);
        if (areaSelect) {
            areaSelect.onchange = () => {
                const fn = window[`cargarEquipos_${m.id}`];
                if (fn) fn();
            };
        }
    }
}

    async function updateModuleWithFile(modId) { const titulo=document.getElementById('editModTitle').value.trim(); let contenido=document.getElementById('editModContent').value; const orden=parseInt(document.getElementById('editModOrder').value)||1; const file=document.getElementById('editModFile').files[0]; if(!titulo) return alert("Título requerido"); if(file){ try{ const url=await uploadFileToStorage(file,'lecciones'); contenido+=`<br><a href="${url}" target="_blank">📎 Material adjunto</a>`; } catch(e){ console.error(e); alert("Error al subir archivo: "+e.message); } } await supabaseClient.from('modulos').update({ titulo, contenido, orden_index:orden }).eq('id',modId); await loadUserData(); closeModal(); const cursoId=modulosList.find(m=>m.id===modId)?.curso_id; if(cursoId) manageModules(cursoId); }
    async function deleteModule(modId) { if(confirm("¿Eliminar esta lección?")){ await supabaseClient.from('modulos').delete().eq('id',modId); await loadUserData(); closeModal(); adminCourses(); } }
    async function adminExams() { let html=`<h3>Exámenes</h3>`; for(let ex of examenes){ const modulo=modulosList.find(m=>m.id===ex.modulo_id); html+=`<div class="card" style="margin-bottom:1rem;"><b>${escapeHtml(ex.titulo)}</b><br>Módulo: ${modulo?modulo.titulo:'?'}<br>Tiempo por pregunta: ${ex.tiempo_por_pregunta} segundos<br><button class="btn btn-primary" onclick="editExam('${ex.id}')">✏️ Editar Examen</button><button class="btn btn-primary" onclick="manageQuestions('${ex.id}')">📋 Preguntas (${preguntas.filter(p=>p.examen_id===ex.id).length})</button><button class="btn btn-danger" onclick="deleteExam('${ex.id}')">🗑️ Eliminar</button></div>`; } html+=`<button class="btn btn-primary" onclick="createExam()">➕ Nuevo Examen</button>`; showModal(html); }
    function createExam() { let modOptions=modulosList.map(m=>`<option value="${m.id}">${escapeHtml(m.titulo)}</option>`).join(''); showModal(`<h3>Nuevo Examen</h3><div class="form-group"><label>Título</label><input id="examTitle" class="form-control"></div><div class="form-group"><label>Módulo</label><select id="examModulo" class="form-control">${modOptions}</select></div><div class="form-group"><label>Tiempo por pregunta (segundos)</label><input id="examTime" type="number" class="form-control" value="15"></div><div style="text-align:right"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveNewExam()">Guardar</button></div>`); }
    async function saveNewExam() { const titulo=document.getElementById('examTitle').value.trim(); const modulo_id=document.getElementById('examModulo').value; const tiempo=parseInt(document.getElementById('examTime').value)||15; if(!titulo) return alert("Título requerido"); await supabaseClient.from('examenes').insert([{ id:generateUniqueId(), modulo_id, titulo, tiempo_por_pregunta:tiempo }]); await loadUserData(); closeModal(); adminExams(); }
    async function editExam(examId) { const exam=examenes.find(e=>e.id===examId); if(!exam) return; let modOptions=modulosList.map(m=>`<option value="${m.id}" ${m.id===exam.modulo_id?'selected':''}>${escapeHtml(m.titulo)}</option>`).join(''); showModal(`<h3>Editar Examen</h3><div class="form-group"><label>Título</label><input id="editExamTitle" class="form-control" value="${escapeHtml(exam.titulo)}"></div><div class="form-group"><label>Módulo</label><select id="editExamModulo" class="form-control">${modOptions}</select></div><div class="form-group"><label>Tiempo por pregunta (segundos)</label><input id="editExamTime" type="number" class="form-control" value="${exam.tiempo_por_pregunta||15}"></div><div style="text-align:right"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="updateExam('${examId}')">Actualizar</button></div>`); }
    async function updateExam(examId) { const titulo=document.getElementById('editExamTitle').value.trim(); const modulo_id=document.getElementById('editExamModulo').value; const tiempo=parseInt(document.getElementById('editExamTime').value)||15; await supabaseClient.from('examenes').update({ titulo, modulo_id, tiempo_por_pregunta:tiempo }).eq('id',examId); await loadUserData(); closeModal(); adminExams(); }
    async function deleteExam(examId) { if(confirm("¿Eliminar este examen y todas sus preguntas?")){ await supabaseClient.from('preguntas').delete().eq('examen_id',examId); await supabaseClient.from('examenes').delete().eq('id',examId); await loadUserData(); adminExams(); } }
    let tempQuestions=[];
    async function manageQuestions(examId) { currentExamId=examId; const existing=preguntas.filter(p=>p.examen_id===examId).sort((a,b)=>a.orden_index-b.orden_index); tempQuestions=existing.map(p=>({...p})); renderQuestionBuilder(); }
    function renderQuestionBuilder() { let html=`<h3>Constructor de Preguntas</h3><div id="questionsList">`; tempQuestions.forEach((q,idx)=>{ html+=`<div class="card" style="margin-bottom:0.5rem;"><b>Pregunta ${idx+1}:</b> ${escapeHtml(q.enunciado)}<br>Tipo: ${q.tipo||'multiple'} | Tiempo: ${q.tiempo_segundos||15}s<div style="margin-top:0.5rem;"><button class="btn btn-secondary" onclick="openQuestionModal(${idx})">✏️ Editar</button><button class="btn btn-danger" onclick="removeQuestion(${idx})">🗑️ Eliminar</button></div></div>`; }); html+=`</div><button class="btn btn-primary" onclick="openQuestionModal()">➕ Agregar Pregunta</button><button class="btn btn-success" onclick="saveAllQuestions()">💾 Guardar todas las preguntas</button><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>`; showModal(html); }
    function openQuestionModal(index=null) { const isEditing=(index!==null); const q=isEditing?tempQuestions[index]:null; window.toggleQuestionOptions=()=>{ const tipo=document.getElementById('qTipo').value; const container=document.getElementById('opcionesContainer'); if(tipo==='multiple'){ container.innerHTML=`<div class="form-group"><label>Opción A</label><input id="opA" class="form-control" value="${escapeHtml(q?.opcion_a||'')}"></div><div class="form-group"><label>Opción B</label><input id="opB" class="form-control" value="${escapeHtml(q?.opcion_b||'')}"></div><div class="form-group"><label>Opción C</label><input id="opC" class="form-control" value="${escapeHtml(q?.opcion_c||'')}"></div><div class="form-group"><label>Opción D</label><input id="opD" class="form-control" value="${escapeHtml(q?.opcion_d||'')}"></div><div class="form-group"><label>Respuesta correcta (letra)</label><select id="respCorrecta" class="form-control">${['A','B','C','D'].map(l=>`<option ${q?.opcion_correcta===l?'selected':''}>${l}</option>`).join('')}</select></div>`; } else if(tipo==='vf'){ container.innerHTML=`<div class="form-group"><label>Respuesta correcta</label><select id="respCorrectaVF" class="form-control"><option ${q?.opcion_correcta==='V'?'selected':''}>Verdadero</option><option ${q?.opcion_correcta==='F'?'selected':''}>Falso</option></select></div>`; } else { container.innerHTML=`<div class="form-group"><label>Respuesta exacta (texto)</label><input id="respCompletar" class="form-control" value="${escapeHtml(q?.opcion_correcta||'')}" placeholder="Ej: Shachah"></div>`; } }; const tipoActual=q?.tipo||'multiple'; const tiempoActual=q?.tiempo_segundos||15; const enunciadoActual=q?.enunciado||''; const modalContent=`<h3>${isEditing?'Editar':'Nueva'} Pregunta</h3><div class="form-group"><label>Enunciado</label><textarea id="qEnunciado" rows="2" class="form-control">${escapeHtml(enunciadoActual)}</textarea></div><div class="form-group"><label>Tipo</label><select id="qTipo" class="form-control" onchange="toggleQuestionOptions()"><option value="multiple" ${tipoActual==='multiple'?'selected':''}>Múltiple (A, B, C, D)</option><option value="vf" ${tipoActual==='vf'?'selected':''}>Verdadero / Falso</option><option value="completar" ${tipoActual==='completar'?'selected':''}>Completar (respuesta corta)</option></select></div><div id="opcionesContainer"></div><div class="form-group"><label>Tiempo para responder (segundos)</label><input id="qTiempo" type="number" class="form-control" value="${tiempoActual}"></div><div style="text-align:right"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveQuestionFromModal(${isEditing?index:'null'})">Guardar</button></div>`; showModal(modalContent); window.toggleQuestionOptions(); }
    function saveQuestionFromModal(index) { const enunciado=document.getElementById('qEnunciado').value.trim(); if(!enunciado) return alert("Enunciado requerido"); const tipo=document.getElementById('qTipo').value; const tiempo=parseInt(document.getElementById('qTiempo').value)||15; let opcion_a='',opcion_b='',opcion_c='',opcion_d='',opcion_correcta=''; if(tipo==='multiple'){ opcion_a=document.getElementById('opA').value; opcion_b=document.getElementById('opB').value; opcion_c=document.getElementById('opC').value; opcion_d=document.getElementById('opD').value; opcion_correcta=document.getElementById('respCorrecta').value; } else if(tipo==='vf'){ opcion_correcta=document.getElementById('respCorrectaVF').value==='Verdadero'?'V':'F'; opcion_a='Verdadero'; opcion_b='Falso'; } else { opcion_correcta=document.getElementById('respCompletar').value.trim(); } const questionData={ id:null, enunciado, tipo, opcion_a, opcion_b, opcion_c, opcion_d, opcion_correcta, tiempo_segundos:tiempo, orden_index:(index!==null)?tempQuestions[index]?.orden_index:tempQuestions.length }; if(index!==null){ tempQuestions[index]={...tempQuestions[index],...questionData}; } else { tempQuestions.push(questionData); } closeModal(); renderQuestionBuilder(); }
    function removeQuestion(idx) { if(confirm("¿Eliminar esta pregunta?")){ tempQuestions.splice(idx,1); tempQuestions.forEach((q,i)=>q.orden_index=i); renderQuestionBuilder(); } }
    async function saveAllQuestions() { if(!currentExamId) return alert("No hay examen seleccionado"); await supabaseClient.from('preguntas').delete().eq('examen_id',currentExamId); for(let i=0;i<tempQuestions.length;i++){ const q=tempQuestions[i]; await supabaseClient.from('preguntas').insert({ id:generateUniqueId(), examen_id:currentExamId, enunciado:q.enunciado, tipo:q.tipo||'multiple', opcion_a:q.opcion_a||'', opcion_b:q.opcion_b||'', opcion_c:q.opcion_c||'', opcion_d:q.opcion_d||'', opcion_correcta:q.opcion_correcta, tiempo_segundos:q.tiempo_segundos, orden_index:i }); } await loadUserData(); alert("Preguntas guardadas correctamente"); closeModal(); adminExams(); }
    function adminAttendance() { let html=`<h3>Registro de Asistencia</h3><div class="form-group"><label>Fecha</label><input id="attDate" class="form-control" placeholder="dd/mm/aaaa"></div><div class="form-group"><label>Miembro</label><select id="attMember" class="form-control">${usuariosIglesia.map(u=>`<option value="${u.id}">${escapeHtml(u.perfiles?.nombre)}</option>`).join('')}</select></div><div class="form-group"><label>Estado</label><select id="attStatus" class="form-control"><option value="puntual">Puntual</option><option value="tarde">Tarde</option></select></div><button class="btn btn-primary" onclick="saveAttendanceAdmin()">Registrar</button><hr><h4>Historial</h4><div id="attList"></div><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>`; showModal(html); flatpickr("#attDate",{locale:"es",dateFormat:"d/m/Y",defaultDate:"today"}); const renderAttList=()=>{ const container=document.getElementById('attList'); if(container) container.innerHTML=attendance.map((a)=>{ const miembro=usuariosIglesia.find(u=>u.id===a.usuario_iglesia_id); return `<div>${a.fecha} - ${miembro?escapeHtml(miembro.perfiles?.nombre):'Desconocido'} (${a.estado}) <button class="btn-icon" onclick="deleteAttendanceAdmin(${a.id})"><i class="fas fa-trash"></i></button></div>`; }).join(''); }; window.saveAttendanceAdmin=async()=>{ const date=document.getElementById('attDate').value; const usuarioIglesiaId=document.getElementById('attMember').value; const status=document.getElementById('attStatus').value; if(!date||!usuarioIglesiaId) return alert("Completa los campos"); const { error } = await supabaseClient.from('asistencia').insert([{ fecha:date, usuario_iglesia_id:usuarioIglesiaId, estado:status }]); if(error) return alert("Error: "+error.message); await loadUserData(); renderAttList(); document.getElementById('attDate').value=''; }; window.deleteAttendanceAdmin=async(id)=>{ if(confirm("¿Eliminar este registro?")){ const { error } = await supabaseClient.from('asistencia').delete().eq('id',id); if(error) return alert("Error: "+error.message); await loadUserData(); renderAttList(); } }; renderAttList(); }
    function adminShifts() { let currentDate=null; async function loadTurnosForDate(dateStr){ const { data, error } = await supabaseClient.from('turnos').select('*, usuarios_iglesia(perfiles(nombre,email))').eq('fecha',dateStr); if(error){ console.error(error); return []; } return data; } async function showDateManagement(dateStr){ currentDate=dateStr; const turnos=await loadTurnosForDate(dateStr); const miembrosPorSubgrupo={}; for(let turno of turnos){ const miembro=usuariosIglesia.find(u=>u.id===turno.usuario_iglesia_id); if(!miembro) continue; const depto=departamentos.find(d=>d.id===miembro.departamento_id); const grupo=depto?depto.nombre:'Otro'; if(!miembrosPorSubgrupo[grupo]) miembrosPorSubgrupo[grupo]=[]; miembrosPorSubgrupo[grupo].push({ id:turno.id, nombre:miembro.perfiles?.nombre, rol:miembro.rol_musical }); } let html=`<h3>📅 Turnos del ${dateStr}</h3><div style="margin-bottom:1rem;">`; for(let [grupo,lista] of Object.entries(miembrosPorSubgrupo)){ if(lista.length===0) continue; html+=`<div class="card" style="margin-bottom:1rem;padding:0.8rem;"><h4>${grupo}</h4>`; for(let item of lista){ html+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;"><div><strong>${escapeHtml(item.nombre)}</strong> (${escapeHtml(item.rol||'Sin rol')})</div><button class="btn-icon" onclick="deleteTurnoFromDate('${item.id}','${dateStr}')" style="color:red;"><i class="fas fa-trash"></i></button></div>`; } html+=`</div>`; } html+=`<div style="margin-top:1rem;"><button class="btn btn-primary" onclick="showAddMemberForm('${dateStr}')">➕ Agregar miembro</button><button class="btn btn-ghost" onclick="closeModal(); adminShifts();">Cerrar</button></div>`; showModal(html); } window.showAddMemberForm=async(dateStr)=>{ const turnosExistentes=await loadTurnosForDate(dateStr); const miembrosOcupados=turnosExistentes.map(t=>t.usuario_iglesia_id); const miembrosDisponibles=usuariosIglesia.filter(u=>!miembrosOcupados.includes(u.id)); if(miembrosDisponibles.length===0){ alert("Todos los miembros ya tienen turno asignado en esta fecha."); closeModal(); adminShifts(); return; } const porSubgrupo={}; for(let m of miembrosDisponibles){ const depto=departamentos.find(d=>d.id===m.departamento_id); const grupo=depto?depto.nombre:'Otro'; if(!porSubgrupo[grupo]) porSubgrupo[grupo]=[]; porSubgrupo[grupo].push(m); } let formHtml=`<h3>Agregar miembro al turno del ${dateStr}</h3>`; for(let [grupo, miembros] of Object.entries(porSubgrupo)){ formHtml+=`<div class="card" style="margin-bottom:1rem;"><h4>${grupo}</h4><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0.5rem;">`; for(let m of miembros){ formHtml+=`<div class="team-member-card" style="cursor:pointer;padding:0.5rem;display:flex;align-items:center;gap:0.5rem;" onclick="confirmAddTurno('${dateStr}','${m.id}','${escapeHtml(m.perfiles?.nombre)}','${escapeHtml(m.rol_musical||'')}')"><div class="avatar" style="width:40px;height:40px;font-size:1rem;">${escapeHtml(m.perfiles?.nombre?.charAt(0).toUpperCase()||'?')}</div><div><strong>${escapeHtml(m.perfiles?.nombre)}</strong><br><span class="card-category">${escapeHtml(m.rol_musical||'Sin rol')}</span></div></div>`; } formHtml+=`</div></div>`; } formHtml+=`<div style="margin-top:1rem;text-align:right;"><button class="btn btn-ghost" onclick="showDateManagement('${dateStr}')">Cancelar</button></div>`; showModal(formHtml); }; window.confirmAddTurno=async(dateStr, usuarioIglesiaId, nombre, rol)=>{ if(confirm(`¿Asignar turno el ${dateStr} a ${nombre} (${rol})?`)){ const { error } = await supabaseClient.from('turnos').insert([{ fecha:dateStr, usuario_iglesia_id:usuarioIglesiaId }]); if(error) alert("Error: "+error.message); else { alert("Turno asignado correctamente"); showDateManagement(dateStr); } } }; window.deleteTurnoFromDate=async(turnoId, dateStr)=>{ if(confirm("¿Eliminar este turno?")){ const { error } = await supabaseClient.from('turnos').delete().eq('id',turnoId); if(error) alert("Error: "+error.message); else showDateManagement(dateStr); } }; const turnosMap={}; shifts.forEach(s=>{ const miembro=usuariosIglesia.find(u=>u.id===s.usuario_iglesia_id); if(miembro){ if(!turnosMap[s.fecha]) turnosMap[s.fecha]=[]; turnosMap[s.fecha].push({ nombre:miembro.perfiles?.nombre, rol:miembro.rol_musical }); } }); const modalHtml=`<h3>📅 Gestión de Turnos por Día</h3><p>Selecciona una fecha en el calendario. Los días con turnos aparecen marcados.</p><div class="form-group"><input type="text" id="shiftCalendar" class="form-control" placeholder="Elige una fecha"></div><div style="margin-top:1rem;"><h4>📋 Resumen de turnos asignados</h4><div style="max-height:300px;overflow-y:auto;border-radius:var(--radius-sm);border:1px solid var(--border);"><table style="width:100%;border-collapse:collapse;"><thead style="position:sticky;top:0;background:var(--surface);"><tr><th style="padding:0.5rem;text-align:left;">Fecha</th><th style="padding:0.5rem;text-align:left;">Miembros (rol)</th></tr></thead><tbody>${Object.entries(turnosMap).map(([fecha, miembros])=>`<tr style="border-top:1px solid var(--border);cursor:pointer;" onclick="showDateManagement('${fecha}')"><td style="padding:0.5rem;"><strong>${fecha}</strong></td><td style="padding:0.5rem;">${miembros.map(m=>`${m.nombre} (${m.rol||'Sin rol'})`).join(', ')}</td></tr>`).join('')||'<tr><td colspan="2" style="padding:1rem;text-align:center;">No hay turnos asignados aún.</td></tr>'}</tbody></table></div></div><div style="text-align:right;margin-top:1rem;"><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button></div>`; showModal(modalHtml); flatpickr("#shiftCalendar",{locale:"es",dateFormat:"d/m/Y",inline:true,onDayCreate:(dObj,dStr,fp,dayElem)=>{ const year=dayElem.dateObj.getFullYear(); const month=String(dayElem.dateObj.getMonth()+1).padStart(2,'0'); const day=String(dayElem.dateObj.getDate()).padStart(2,'0'); const dateStr=`${day}/${month}/${year}`; if(turnosMap[dateStr]){ dayElem.style.backgroundColor='#3B82F6'; dayElem.style.color='white'; dayElem.style.borderRadius='50%'; dayElem.title=`Turnos: ${turnosMap[dateStr].map(m=>m.nombre).join(', ')}`; } }, onChange:(selectedDates,dateStr)=>{ if(dateStr) showDateManagement(dateStr); } }); }


   
// ========== INICIALIZACIÓN ==========
(async () => { const { data: { session } } = await supabaseClient.auth.getSession(); if(session){ currentUser=session.user; await loadProfile(); await loadUserIglesia(); if(currentIglesiaId || isAdminUser) { await loadUserData(); renderApp(); } else { renderApp(); } } else { renderLogin(); } })();
</script>
