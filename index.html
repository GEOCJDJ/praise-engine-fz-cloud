function renderCifraFromText(content) {
    if (!content) {
        document.getElementById('cifraContentWrapper').innerHTML = '<p style="color:#64748b; text-align:center;">No hay letra disponible.</p>';
        return;
    }
    // Convertir a líneas
    const lines = content.split(/\r?\n/);
    const chordPattern = /\b([A-G][#b]?(?:m|maj|min|dim|sus|aug|add)?\d*(?:\/[A-G][#b]?)?)\b/gi;
    let html = '<pre style="font-family: \'Courier New\', Courier, monospace; white-space: pre-wrap; text-align: left; margin: 0; padding: 0; line-height: 1.6;">';
    for (let line of lines) {
        let coloredLine = line.replace(chordPattern, match => `<strong class="chord" style="color: #dc2626; font-weight: bold;">${match}</strong>`);
        html += coloredLine + '\n';
    }
    html += '</pre>';
    const wrapper = document.getElementById('cifraContentWrapper');
    wrapper.innerHTML = html;
    // Aplicar tamaño de letra guardado
    const preElem = wrapper.querySelector('pre');
    if (preElem) preElem.style.fontSize = cifraFontSize + 'px';
}

    function applyTransposition(offset) {
    if (!cifraOriginalContent) return;
    if (offset === 0) {
        renderCifraFromText(cifraOriginalContent);
        return;
    }
    const lines = cifraOriginalContent.split(/\r?\n/);
    // Expresión para detectar líneas que son SOLO acordes
    const chordLineRegex = /^[\s]*([A-G][#b]?(m|maj|min|dim|sus|aug|7M|M7|\d)*(\/[A-G][#b]?)?[\s,\.]*)+$/i;
    const tokenRegex = /([A-G][#b]?)([^/\s]*)(\/([A-G][#b]?))?/g;

    const transposedLines = lines.map(line => {
        if (chordLineRegex.test(line) && line.trim().length > 0) {
            // Línea de acordes: transponer cada token
            return line.replace(tokenRegex, (match, root, mod, slashPart, slashRoot) => {
                let newRoot = root;
                let idx = NOTE_TO_INDEX[root.toUpperCase()];
                if (idx !== undefined) {
                    let newIdx = (idx + offset + 12) % 12;
                    newRoot = INDEX_TO_NOTE[newIdx];
                }
                let newSlash = '';
                if (slashRoot) {
                    let sIdx = NOTE_TO_INDEX[slashRoot.toUpperCase()];
                    if (sIdx !== undefined) {
                        let newSIdx = (sIdx + offset + 12) % 12;
                        newSlash = '/' + INDEX_TO_NOTE[newSIdx];
                    }
                }
                return newRoot + (mod || '') + newSlash;
            });
        }
        // También transponer la línea "Tono: X" si existe
        if (line.toLowerCase().startsWith('tono:')) {
            return line.replace(/([A-G][#b]?)(m|maj|min)?/i, (match, root, mod) => {
                let idx = NOTE_TO_INDEX[root.toUpperCase()];
                if (idx !== undefined) {
                    let newIdx = (idx + offset + 12) % 12;
                    return INDEX_TO_NOTE[newIdx] + (mod || '');
                }
                return match;
            });
        }
        return line;
    });
    renderCifraFromText(transposedLines.join('\n'));
}

function transposeLyricsCompleto(text, fromKey, toKey) {
    if (!text || fromKey === toKey) return text;
    
    const lines = text.split('\n');
    const semitones = (noteMap[toKey.replace(/m$/, '')] - noteMap[fromKey.replace(/m$/, '')] + 12) % 12;
    
    const chordRegex = /\b([A-G][#b]?(?:m|maj|min|dim|sus|aug|add)?\d*(?:\/[A-G][#b]?)?)\b/gi;
    
    const transposedLines = lines.map(line => {
        const isChordLine = /^[\sA-Ga-g0-9#b\/]+$/.test(line) && !/[aeiouáéíóú]/i.test(line);
        if (isChordLine && line.trim().length > 0) {
            return line.replace(chordRegex, (match) => transposeChord(match, semitones));
        } else {
            // Línea de letra: también transponer acordes sueltos
            return line.replace(chordRegex, (match) => transposeChord(match, semitones));
        }
    });
    return transposedLines.join('\n');
}
function transposeCifra(steps) {
    if (!cifraOriginalContent) return;
    cifraCurrentOffset += steps;
    // Asegurar rango 0-11
    cifraCurrentOffset = ((cifraCurrentOffset % 12) + 12) % 12;
    // Mostrar la nueva tonalidad resultante
    let newKey = getShiftedKey(cifraCurrentSong.key, cifraCurrentOffset);
    document.getElementById('currentToneDisplay').innerText = newKey;
    applyTransposition(cifraCurrentOffset);
}

// Transpone directamente N semitonos desde el texto base (sin necesitar fromKey/toKey)
function transponeSemitonos(text, semitones) {
    if (!text || semitones === 0) return text;
    const semiNorm = ((semitones % 12) + 12) % 12;
    if (semiNorm === 0) return text;

    // Regex que captura la raíz del acorde + sufijo completo (incluye números como 7M, 9, 7, 7M, 7sus, etc.)
    // NO transpone palabras comunes (la, mi, re como pronombres) gracias al contexto de la línea
    const lines = text.split('\n');
    return lines.map(line => {
        // Detectar si es línea de acordes: sin vocales españolas y contiene notas
        const isChordLine = /^[\sA-Ga-g0-9#b\/\(\)]+$/.test(line) && !/[aeiouáéíóúü]/i.test(line);
        if (!isChordLine || line.trim().length === 0) return line;

        // Regex para acordes en línea de acordes: captura raíz + sufijo completo
        return line.replace(/\b([A-G][#b]?)((?:maj|min|dim|aug|sus|add|M)?(?:\d+)?(?:\/[A-G][#b]?)?)\b/g, (match, root, suffix) => {
            let idx = noteMap[root];
            if (idx === undefined) return match;
            let newIdx = (idx + semiNorm) % 12;
            return noteNames[newIdx] + suffix;
        });
    }).join('\n');
}

function getShiftedKey(origKey, shift) {
    if (!origKey) return 'C';
    const isMinor = origKey.endsWith('m');
    const base = origKey.replace(/m$/, '');
    let idx = noteMap[base];
    if (idx === undefined) return origKey;
    let newIdx = (idx + shift + 12) % 12;
    let newBase = noteNames[newIdx];
    return newBase + (isMinor ? 'm' : '');
}

async function saveCifraStateToServer() {
    if (!cifraCurrentSong) return;
    if (!isAdminUser && !isIglesiaAdmin) {
        alert("Solo administrador puede guardar cambios permanentes.");
        return;
    }
    let finalKey = getShiftedKey(cifraCurrentSong.key, cifraCurrentOffset);
    let finalBpm = parseInt(document.getElementById('cifraBpmInput').value) || 80;
    let finalCapo = document.getElementById('cifraCapoInput').value;
    // Si hay offset, transpramos el original y lo guardamos como nuevo original
    if (cifraCurrentOffset !== 0) {
        const lines = cifraOriginalContent.split(/\r?\n/);
        const chordLineRegex = /^[\s]*([A-G][#b]?(m|maj|min|dim|sus|aug|7M|M7|\d)*(\/[A-G][#b]?)?[\s,\.]*)+$/i;
        const tokenRegex = /([A-G][#b]?)([^/\s]*)(\/([A-G][#b]?))?/g;
        const transposedLines = lines.map(line => {
            if (chordLineRegex.test(line)) {
                return line.replace(tokenRegex, (match, root, mod, slashPart, slashRoot) => {
                    let newRoot = root;
                    let idx = NOTE_TO_INDEX[root.toUpperCase()];
                    if (idx !== undefined) {
                        let newIdx = (idx + cifraCurrentOffset + 12) % 12;
                        newRoot = INDEX_TO_NOTE[newIdx];
                    }
                    let newSlash = '';
                    if (slashRoot) {
                        let sIdx = NOTE_TO_INDEX[slashRoot.toUpperCase()];
                        if (sIdx !== undefined) {
                            let newSIdx = (sIdx + cifraCurrentOffset + 12) % 12;
                            newSlash = '/' + INDEX_TO_NOTE[newSIdx];
                        }
                    }
                    return newRoot + (mod || '') + newSlash;
                });
            }
            return line;
        });
        cifraCurrentSong.lyrics = transposedLines.join('\n');
        cifraCurrentSong.key = finalKey;
    } else {
        cifraCurrentSong.lyrics = cifraOriginalContent;
        cifraCurrentSong.key = finalKey;
    }
    cifraCurrentSong.bpm = finalBpm;
    cifraCurrentSong.capo = finalCapo;
    await saveSong(cifraCurrentSong);
    // Después de guardar, resetear el original al contenido guardado y offset 0
    cifraOriginalContent = cifraCurrentSong.lyrics;
    cifraCurrentOffset = 0;
    document.getElementById('currentToneDisplay').innerText = finalKey;
    applyTransposition(0);
    alert("¡Canción actualizada con el nuevo tono, BPM y Capo!");
}

function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' })[m]); }
function closeModal() { document.getElementById('modal')?.remove(); }

function dataURLtoBlob(dataURL) { const arr = dataURL.split(','); const mime = arr[0].match(/:(.*?);/)[1]; const bstr = atob(arr[1]); let n = bstr.length; const u8arr = new Uint8Array(n); while (n--) u8arr[n] = bstr.charCodeAt(n); return new Blob([u8arr], {type: mime}); }
function generateUniqueId() { if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID(); return Date.now() + '-' + Math.random().toString(36).substr(2, 9); }
async function uploadFileToStorage(file, folder) { if (!file) return null; const fileExt = file.name.split('.').pop(); const fileName = `${folder}/${Date.now()}.${fileExt}`; const { data, error } = await supabaseClient.storage.from('lecciones').upload(fileName, file); if (error) throw error; const { data: { publicUrl } } = supabaseClient.storage.from('lecciones').getPublicUrl(fileName); return publicUrl; }
function transposeChord(chord, semitones) {
    // Separa la raíz (ej. C, C#, F) del resto (m, 7, maj7, /E, etc.)
    const match = chord.match(/^([A-G][#b]?)(.*)$/);
    if (!match) return chord;
    let base = match[1];
    let suffix = match[2];
    let idx = noteMap[base];
    if (idx === undefined) return chord;
    let newIdx = (idx + semitones + 12) % 12;
    let newBase = noteNames[newIdx];
    return newBase + suffix;
}
    function transposeLyrics(text, fromKey, toKey) { if (!text || !fromKey || !toKey || fromKey === toKey) return text; const fromBase = fromKey.replace(/m$/, ''), toBase = toKey.replace(/m$/, ''); let semitones = (noteMap[toBase] - noteMap[fromBase] + 12) % 12; if (fromKey.endsWith('m')) semitones = (semitones + 12) % 12; if (toKey.endsWith('m') && !fromKey.endsWith('m')) semitones = (semitones + 12) % 12; return text.replace(/\[([A-G][#b]?[^\]]*)\]/g, (match, chord) => `[${transposeChord(chord, semitones)}]`); }
function convertSpacedChordsToBrackets(text) { const lines = text.split('\n'); const result = []; let i = 0; while (i < lines.length) { let line = lines[i]; if (line.trim() === '') { result.push(line); i++; continue; } if (/^[\sA-Ga-g0-9#b\/]+$/.test(line) && !/[aeiouáéíóú]/i.test(line) && i+1 < lines.length) { const chords = line.trim().split(/\s+/); const lyricLine = lines[i+1]; const words = lyricLine.split(/(\s+)/); let newLine = ''; let chordIndex = 0; for (let word of words) { if (word.trim() !== '' && chordIndex < chords.length) { newLine += `[${chords[chordIndex]}]${word}`; chordIndex++; } else { newLine += word; } } result.push(newLine); i += 2; } else { result.push(line); i++; } } return result.join('\n'); }
function renderChordsOverLyrics(text) {
    if (!text) return '<p style="color:#64748b; text-align:center;">No hay letra disponible.</p>';
    
    let cleanText = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/&nbsp;/g, ' ');
    const lines = cleanText.split('\n');
    const chordRegex = /\b([A-G][#b]?(?:m|maj|min|dim|sus|aug|add)?\d*(?:\/[A-G][#b]?)?)\b/gi;
    let preContent = '';
    
    for (let line of lines) {
        if (line.trim() === '') {
            preContent += '\n';
            continue;
        }
        let coloredLine = line.replace(chordRegex, (match) => `<strong class="chord">${match}</strong>`);
        preContent += coloredLine + '\n';
    }
    
    // Eliminamos font-size fijo
    return `<pre style="font-family: 'Courier New', Courier, monospace; white-space: pre-wrap; text-align: left; margin: 0; padding: 0; line-height: 1.6;">${preContent}</pre>`;
}

    window.showPreviewInNewSong = () => {
        const textarea = document.getElementById('newSongLyrics');

        if (textarea && previewDiv) {
            previewDiv.innerHTML = renderChordsOverLyrics(textarea.value);
            previewContainer.style.display = 'block';
        }
    };
    window.transposeNewSong = (steps) => {
        const textarea = document.getElementById('newSongLyrics');
        const currentKeySpan = document.getElementById('newSongCurrentKey');
        if (!textarea || !currentKeySpan) return;
        let currentKey = currentKeySpan.innerText;
        let idx = keys.indexOf(currentKey);
        let newIdx = (idx + steps + keys.length) % keys.length;
        let newKey = keys[newIdx];
        textarea.value = transposeLyrics(textarea.value, currentKey, newKey);
        currentKeySpan.innerText = newKey;
        if (document.getElementById('newSongPreview').style.display === 'block') window.showPreviewInNewSong();

    window.applyNewSongTranspose = () => {
        const textarea = document.getElementById('newSongLyrics');

    async function saveSongFromModal(id) { if (!isAdminUser && !isIglesiaAdmin) return; const title = document.getElementById('mTitle').value.trim(); if (!title) return alert("Título requerido"); const category = document.getElementById('mCat').value; const key = document.getElementById('mKey').value; const bpm = parseInt(document.getElementById('mBpm').value) || 80; const chordsUrl = document.getElementById('mChordsUrl').value.trim(); const lyrics = document.getElementById('mLyrics').value; let chordsData = ''; const file = document.getElementById('mChordsFile').files[0]; if (file) { const reader = new FileReader(); await new Promise(resolve => { reader.onload = e => { chordsData = e.target.result; resolve(); }; reader.readAsDataURL(file); }); } else if (id) { const existingSong = songs.find(s=>s.id===id); if (existingSong) chordsData = existingSong.chordsData || ''; } const song = { id: id || generateUniqueId(), title, category, key, bpm, chordsUrl, chordsData, lyrics, youtube: '' }; await saveSong(song); closeModal(); }
    
    function openMetronome(songId) { const song = songs.find(s=>s.id===songId); if(!song) return; const bpm = song.bpm||80; const intervalMs = 60000/bpm; if(metronomeInterval) clearInterval(metronomeInterval); showModal(`<div style="text-align:center"><h3>Metrónomo: ${escapeHtml(song.title)}</h3><div class="metronome-led" id="metroLed"></div><p style="font-size:1.5rem;">${bpm} BPM</p><button class="btn btn-primary" id="startMetroBtn">Iniciar</button><button class="btn btn-ghost" id="stopMetroBtn">Detener</button><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button></div>`); const led = document.getElementById('metroLed'), startBtn = document.getElementById('startMetroBtn'), stopBtn = document.getElementById('stopMetroBtn'); let isRunning = false; const tick = () => { led.style.background="#3B82F6"; if(navigator.vibrate) navigator.vibrate(40); setTimeout(()=>led.style.background="#475569",100); }; startBtn.onclick = () => { if(!isRunning) { isRunning=true; tick(); metronomeInterval = setInterval(()=>{ if(isRunning) tick(); }, intervalMs); } }; stopBtn.onclick = () => { if(metronomeInterval) clearInterval(metronomeInterval); isRunning=false; }; }

    async function cargarLibrosDisponibles() {
  const { data, error } = await supabaseClient
    .from('lista_libros')
    .select('libro');
  if (error) throw error;
  return data.map(v => v.libro);
}

async function obtenerCapitulosDisponibles(book) {
  const { data, error } = await supabaseClient
    .from('versiculos_biblia')
    .select('capitulo')
    .eq('libro', book)
    .order('capitulo');
  if (error) throw error;
  const chapters = [...new Set(data.map(v => v.capitulo))];
  return chapters.sort((a,b) => a-b);
}

async function getVersiculos(book, chapter) {
  const { data, error } = await supabaseClient
    .from('versiculos_biblia')
    .select('versiculo, texto')
    .eq('libro', book)
    .eq('capitulo', chapter)
    .order('versiculo');
  if (error) {
    console.error(error);
    return [];
  }
  return data;
}

    async function cargarCapitulo(book, chapter) {
  scCurrentBook = book;
  scCurrentChapter = chapter;
  scSelectedVerses = [];
  cerrarPanelContextual();
  document.getElementById('sc-header-title').innerText = `${book} ${chapter}`;
  highlightActiveBook(book);
  await renderChapterContent(book, chapter);
  await actualizarSelectorCapitulos();
}

async function actualizarSelectorCapitulos() {
  const selector = document.getElementById('sc-chapter-select');
  if (!selector) return;
  const capitulos = await obtenerCapitulosDisponibles(scCurrentBook);
  selector.innerHTML = '';
  capitulos.forEach(ch => {
    const opt = document.createElement('option');
    opt.value = ch;
    opt.textContent = `Capítulo ${ch}`;
    if (ch === scCurrentChapter) opt.selected = true;
    selector.appendChild(opt);
  });
  selector.style.display = capitulos.length > 1 ? 'inline-block' : 'none';
}

// ========== RENDERIZADO DEL CAPÍTULO (MODERNO) ==========
async function renderChapterContent(book, chapter) {
  const container = document.getElementById('sc-bible-text-flow');
  if (!container) return;
  container.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-pulse"></i> Cargando...</div>';
  
  const versiculos = await getVersiculos(book, chapter);
  if (!versiculos.length) {
    container.innerHTML = '<div class="empty-chapter">⚠️ Capítulo no encontrado.</div>';
    return;
  }
  container.innerHTML = '';
  container.style.fontFamily = "'Georgia', 'Times New Roman', serif";
  container.style.fontSize = "1.1rem";
  container.style.lineHeight = "1.8";
  container.style.color = "var(--text-main)";

  for (let v of versiculos) {
    const verseNum = v.versiculo;
    const verseText = v.texto;
    const uniqueKey = `${book}_${chapter}_${verseNum}`;
    const savedHighlight = scHighlights[uniqueKey] || '';
    const isSelected = scSelectedVerses.includes(verseNum);

    const verseWrapper = document.createElement('div');
    verseWrapper.className = `verse-block ${savedHighlight} ${isSelected ? 'selected-verse' : ''}`;
    verseWrapper.setAttribute('data-verse', verseNum);

    numSpan.className = 'verse-number';

// ========== SELECCIÓN MÚLTIPLE (CON SHIFT PARA RANGOS) ==========
function seleccionarVersiculo(verseNum, event) {
  if (event.shiftKey && scSelectedVerses.length > 0) {
    const last = scSelectedVerses[scSelectedVerses.length - 1];
    const start = Math.min(last, verseNum);
    const end = Math.max(last, verseNum);
    const newRange = [];
    for (let i = start; i <= end; i++) newRange.push(i);
    scSelectedVerses = newRange;
  } else {
    if (scSelectedVerses.includes(verseNum)) {
      scSelectedVerses = scSelectedVerses.filter(v => v !== verseNum);
    } else {
      scSelectedVerses.push(verseNum);
    }
  }
  // Actualizar UI resaltando los seleccionados
  document.querySelectorAll('#sc-bible-text-flow .verse-block').forEach(el => {
    const v = parseInt(el.getAttribute('data-verse'));
    if (scSelectedVerses.includes(v)) {
      el.classList.add('selected-verse');
    } else {
      el.classList.remove('selected-verse');
    }
  });
  if (scSelectedVerses.length > 0) {
    abrirPanelContextual();
  } else {
    cerrarPanelContextual();
  }
}

function abrirPanelContextual() {
  const panel = document.getElementById('scCtxPanel');
  if (panel) panel.classList.add('open');
  const indicator = document.getElementById('sc-ctx-verse-indicator');
  if (indicator) {
    if (scSelectedVerses.length === 1) {
      indicator.innerHTML = `<i class="fa-solid fa-book-open"></i> ${scCurrentBook} ${scCurrentChapter}:${scSelectedVerses[0]}`;
    } else {
      const min = Math.min(...scSelectedVerses);
      const max = Math.max(...scSelectedVerses);
      indicator.innerHTML = `<i class="fa-solid fa-book-open"></i> ${scCurrentBook} ${scCurrentChapter}:${min}‑${max}`;
    }
  }
  // Actualizar vista de comparación con el texto seleccionado
  actualizarVistaComparacion();
  // Actualizar botón de favorito
  const esFavorito = scFavorites.some(f =>
    f.book === scCurrentBook && f.chapter === scCurrentChapter &&
    f.verseStart === Math.min(...scSelectedVerses) &&
    f.verseEnd === Math.max(...scSelectedVerses)
  );
  const favBtn = document.getElementById('sc-btn-fav');
  if (favBtn) {
    if (esFavorito) {
      favBtn.classList.add('active');
      favBtn.innerHTML = `<i class="fa-solid fa-star"></i> Guardado en Joyas`;
    } else {
      favBtn.classList.remove('active');
      favBtn.innerHTML = `<i class="fa-solid fa-star"></i> Marcar Favorito`;
    }
  }
}

async function actualizarVistaComparacion() {
  if (scSelectedVerses.length === 0) return;
  const versiculos = await getVersiculos(scCurrentBook, scCurrentChapter);
  const textos = scSelectedVerses.map(v => {
    const vObj = versiculos.find(vv => vv.versiculo === v);
    return vObj ? vObj.texto : '';
  }).filter(t => t);
  const compView = document.getElementById('scComparisonView');
  if (compView) {
    compView.innerHTML = `
      <div class="sc-version-card">
        <div class="sc-v-title">REINA VALERA 1960</div>
        <div class="sc-v-text">${textos.join(' ')}</div>
      </div>
    `;
  }
}

function cerrarPanelContextual() {
  const panel = document.getElementById('scCtxPanel');
  if (panel) panel.classList.remove('open');
}

// ========== RESALTADO Y FAVORITOS EN SUPABASE ==========
async function applyHighlightToSelected(hlClass) {
  if (!currentUser) {
    alert('Debes iniciar sesión para resaltar');
    return;
  }
  if (scSelectedVerses.length === 0) {
    alert('Selecciona uno o más versículos');
    return;
  }
  for (let verseNum of scSelectedVerses) {
    const uniqueKey = `${scCurrentBook}_${scCurrentChapter}_${verseNum}`;
    const target = document.getElementById(`vbox-${uniqueKey}`);
    if (!target) continue;
    // Quitar clases anteriores
    target.classList.remove('hl-gold', 'hl-emerald', 'hl-sapphire', 'hl-ruby');
    if (hlClass !== 'clear') {
      target.classList.add(hlClass);
      scHighlights[uniqueKey] = hlClass;
    } else {
      delete scHighlights[uniqueKey];
    }
    // Guardar en Supabase (upsert)
    const { error } = await supabaseClient.from('biblia_progreso').upsert({
      user_id: currentUser.id,
      libro: scCurrentBook,
      capitulo: scCurrentChapter,
      versiculo: verseNum,
      resaltado_color: hlClass !== 'clear' ? hlClass : null,
      es_favorito: scFavorites.some(f =>
        f.book === scCurrentBook && f.chapter === scCurrentChapter &&
        f.verseStart <= verseNum && f.verseEnd >= verseNum
      )
    }, { onConflict: 'user_id, libro, capitulo, versiculo' });
    if (error) console.error('Error guardando resaltado:', error);
    else console.log(`Resaltado guardado para ${scCurrentBook} ${scCurrentChapter}:${verseNum}`);
  }
}

async function toggleFavoriteSelected() {
  if (!currentUser) {
    alert('Debes iniciar sesión');
    return;
  }
  if (scSelectedVerses.length === 0) return;

  const verseStart = Math.min(...scSelectedVerses);
  const verseEnd = Math.max(...scSelectedVerses);
  const existingIndex = scFavorites.findIndex(f =>
    f.book === scCurrentBook && f.chapter === scCurrentChapter &&
    f.verseStart === verseStart && f.verseEnd === verseEnd
  );

  // Obtener el texto de los versículos seleccionados
  const versiculos = await getVersiculos(scCurrentBook, scCurrentChapter);
  const textos = scSelectedVerses.map(v => {
    const vObj = versiculos.find(vv => vv.versiculo === v);
    return vObj ? vObj.texto : '';
  }).filter(t => t);
  const textoCompleto = textos.join(' ');

  if (existingIndex > -1) {
    // Eliminar favorito
    scFavorites.splice(existingIndex, 1);
    for (let v = verseStart; v <= verseEnd; v++) {
      const { error } = await supabaseClient.from('biblia_progreso')
        .update({ es_favorito: false })
        .eq('user_id', currentUser.id)
        .eq('libro', scCurrentBook)
        .eq('capitulo', scCurrentChapter)
        .eq('versiculo', v);
      if (error) console.error('Error eliminando favorito:', error);
    }
  } else {
    // Agregar favorito
    scFavorites.push({
      book: scCurrentBook,
      chapter: scCurrentChapter,
      verseStart,
      verseEnd,
      text: textoCompleto
    });
    for (let v = verseStart; v <= verseEnd; v++) {
      const uniqueKey = `${scCurrentBook}_${scCurrentChapter}_${v}`;
      const { error } = await supabaseClient.from('biblia_progreso').upsert({
        user_id: currentUser.id,
        libro: scCurrentBook,
        capitulo: scCurrentChapter,
        versiculo: v,
        es_favorito: true,
        resaltado_color: scHighlights[uniqueKey] || null
      }, { onConflict: 'user_id, libro, capitulo, versiculo' });
      if (error) console.error('Error guardando favorito:', error);
    }
  }
  // Refrescar panel y sidebar
  abrirPanelContextual();
  renderFavoritesSidebar();
}

function shareVerseAction() {
  if (scSelectedVerses.length === 0) return;
  const verseStart = Math.min(...scSelectedVerses);
  const verseEnd = Math.max(...scSelectedVerses);
  // No podemos obtener el texto aquí de forma síncrona; lo obtenemos desde el DOM o desde la variable global.
  const compView = document.getElementById('scComparisonView');
  const texto = compView?.querySelector('.sc-v-text')?.innerText || '';
  let referencia;
  if (scSelectedVerses.length === 1) {
    referencia = `${scCurrentBook} ${scCurrentChapter}:${scSelectedVerses[0]}`;
  } else {
    referencia = `${scCurrentBook} ${scCurrentChapter}:${verseStart}‑${verseEnd}`;
  }
  const shareString = `"${texto}" — ${referencia}`;
  navigator.clipboard.writeText(shareString);
  alert('¡Versículo(s) copiado(s) al portapapeles!');
}

// ========== CARGA DE FAVORITOS Y RESALTADOS DEL USUARIO ==========
async function cargarFavoritosUsuario() {
  if (!currentUser) {
    console.log('No hay usuario logueado, no se cargan favoritos');
    return;
  }
  const { data, error } = await supabaseClient
    .from('biblia_progreso')
    .select('*')
    .eq('user_id', currentUser.id);
  if (error) {
    console.error('Error cargando favoritos:', error);
    return;
  }
  console.log('Datos de biblia_progreso:', data); // Ver qué trae
  scHighlights = {};
  const favMap = new Map();
  for (let item of data) {
    if (item.resaltado_color) {
      const key = `${item.libro}_${item.capitulo}_${item.versiculo}`;
      scHighlights[key] = item.resaltado_color;
    }
    if (item.es_favorito) {
      const key = `${item.libro}_${item.capitulo}`;
      if (!favMap.has(key)) favMap.set(key, []);
      favMap.get(key).push(item.versiculo);
    }
  }
  scFavorites = [];
  for (let [key, verses] of favMap.entries()) {
    const [libro, capitulo] = key.split('_');
    verses.sort((a,b) => a-b);
    let start = verses[0];
    let end = verses[0];
    for (let i = 1; i < verses.length; i++) {
      if (verses[i] === end + 1) end = verses[i];
      else {
        scFavorites.push({ book: libro, chapter: parseInt(capitulo), verseStart: start, verseEnd: end, text: '' });
        start = verses[i];
        end = verses[i];
      }
    }
    scFavorites.push({ book: libro, chapter: parseInt(capitulo), verseStart: start, verseEnd: end, text: '' });
  }
  console.log('scFavorites cargados:', scFavorites);
  renderFavoritesSidebar();
}

function renderFavoritesSidebar() {
  const container = document.getElementById('sc-favs-dynamic-list');
  if (!container) {
    console.error('❌ No se encontró #sc-favs-dynamic-list');
    return;
  }
  if (scFavorites.length === 0) {
    container.innerHTML = '<div class="empty-favs">✨ No has guardado versículos favoritos aún. Selecciona uno o más versículos y toca la estrella.</div>';
    return;
  }
  container.innerHTML = scFavorites.map(f => {
    let ref = (f.verseStart === f.verseEnd) ? `${f.book} ${f.chapter}:${f.verseStart}` : `${f.book} ${f.chapter}:${f.verseStart}‑${f.verseEnd}`;
    return `<div class="sc-fav-item" onclick="cargarCapitulo('${f.book}', ${f.chapter})"><strong>${ref}</strong><span>${(f.text || '').substring(0, 80)}...</span></div>`;
  }).join('');
}

// ========== CONSTRUCCIÓN DE LISTA DE LIBROS ==========
async function buildBooksList() {
  const otContainer = document.getElementById('ot-books-list');
  const ntContainer = document.getElementById('nt-books-list');
  if (!otContainer || !ntContainer) return;
  otContainer.innerHTML = '';
  ntContainer.innerHTML = '';
  const librosExistentes = await cargarLibrosDisponibles();
  const existingSet = new Set(librosExistentes);
  for (let book of OT_BOOKS) {
    if (existingSet.has(book)) {
      const li = document.createElement('li');
      li.className = 'sc-book-item';
      li.setAttribute('data-book', book);
      li.innerHTML = `<i class="fa-solid fa-book-open"></i> ${book}`;
      li.onclick = () => {
        obtenerCapitulosDisponibles(book).then(caps => {
          cargarCapitulo(book, caps.length ? caps[0] : 1);
        });
      };
      otContainer.appendChild(li);
    }
  }
  for (let book of NT_BOOKS) {
    if (existingSet.has(book)) {
      const li = document.createElement('li');
      li.className = 'sc-book-item';
      li.setAttribute('data-book', book);
      li.innerHTML = `<i class="fa-solid fa-book-open"></i> ${book}`;
      li.onclick = () => {
        obtenerCapitulosDisponibles(book).then(caps => {
          cargarCapitulo(book, caps.length ? caps[0] : 1);
        });
      };
      ntContainer.appendChild(li);
    }
  }
  const searchInput = document.getElementById('bibleSearchInput');
  if (searchInput) {
    searchInput.removeEventListener('input', handleBookSearch);
    searchInput.addEventListener('input', handleBookSearch);
  }
}

function handleBookSearch(e) {
  const term = e.target.value.toLowerCase().trim();
  document.querySelectorAll('#gpraise-scriptura-shield .sc-book-item').forEach(el => {
    const book = el.getAttribute('data-book').toLowerCase();
    el.style.display = (term === '' || book.includes(term)) ? 'flex' : 'none';
  });
}

function highlightActiveBook(book) {
  document.querySelectorAll('#gpraise-scriptura-shield .sc-book-item').forEach(el => {
    if (el.getAttribute('data-book') === book) el.classList.add('active');
    else el.classList.remove('active');
  });
}

async function openEquiposView() { const tree = buildDepartmentTree(departamentos); let html = `<h3>🎭 Equipos de la Iglesia - ${currentIglesiaData?.nombre}</h3>`; html += renderDepartmentTree(tree, 0); html += `<button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>`; showModal(html); }

    function parseChoFile(content, filename) {
    const lines = content.split(/\r?\n/);
    let metadata = {
        title: filename.replace(/\.cho$/i, ''),
        artist: '',
        key: 'C',
        tempo: 80
    };
    
    let lyricsLines = [];
    
    for (let rawLine of lines) {
        let line = rawLine.trim();
        if (line === '') {
            lyricsLines.push('');
            continue;
        }

        // 1. Extraer Metadatos y Comentarios (Tags { })
        if (line.startsWith('{') && line.endsWith('}')) {
            const inner = line.slice(1, -1);
            const lowerInner = inner.toLowerCase();
            if (lowerInner.startsWith('title:')) metadata.title = inner.substring(6).trim();
            else if (lowerInner.startsWith('artist:')) metadata.artist = inner.substring(7).trim();
            else if (lowerInner.startsWith('key:')) metadata.key = inner.substring(4).trim();
            else if (lowerInner.startsWith('tempo:')) metadata.tempo = parseInt(inner.substring(6).trim()) || 80;
            else if (lowerInner.startsWith('c:')) {
                // Comentarios se muestran como texto
                const comment = inner.substring(2).trim();
                if (comment) lyricsLines.push(comment.toUpperCase());
            }
            continue;
        }

        // 2. Limpiar barras dobles de repetición '//'
        line = line.replace(/\/\//g, '').trim();
        if (line === '') continue;

        // 3. Separar Acordes arriba y Letra abajo
        if (line.includes('[')) {
            let chordLine = '';
            let textLine = '';
            let currentTextLength = 0;
            
            const regex = /([^\[]*)\[([^\]]+)\]/g;
            let match;
            let lastIndex = 0;

            while ((match = regex.exec(line)) !== null) {
                const textBeforeChord = match[1];
                const chord = match[2];
                
                textLine += textBeforeChord;
                currentTextLength += textBeforeChord.length;
                
                while (chordLine.length < currentTextLength) {
                    chordLine += ' ';
                }
                chordLine += chord;
                lastIndex = regex.lastIndex;
            }
            
            const remainingText = line.substring(lastIndex);
            textLine += remainingText;

            if (chordLine.trim() !== '') lyricsLines.push(chordLine);
            if (textLine.trim() !== '') lyricsLines.push(textLine);
        } else {
            // Línea sin acordes
            lyricsLines.push(line);
        }
    }

    return {
        selected: true,
        title: metadata.title,
        category: metadata.artist || 'Adoración',
        key: metadata.key,
        bpm: metadata.tempo,
        lyrics: lyricsLines.join('\n'),
        chordsData: '',
        chordsUrl: '',
        originalFilename: filename
    };
}

async function viewMyShifts() {

    }
    const misTurnos = shifts.filter(s => s.usuario_iglesia_id === miembro.id);
    misTurnos.sort((a,b) => {
        const da = a.fecha.split('/').reverse().join('-');
        const db = b.fecha.split('/').reverse().join('-');
        return new Date(da) - new Date(db);
    });
    const turnosPorFecha = {};
    misTurnos.forEach(t => { turnosPorFecha[t.fecha] = true; });

    const { data: actividades } = await supabaseClient
        .from('actividades')
        .select('*')
        .eq('iglesia_id', currentIglesiaId)
        .order('fecha');
    const actividadesPorFecha = {};
    const proximasActividades = [];
    const hoy = new Date();
    hoy.setHours(0,0,0,0);
    (actividades || []).forEach(act => {
        actividadesPorFecha[act.fecha] = true;
        const [dia, mes, anio] = act.fecha.split('/');
        const fechaAct = new Date(anio, mes-1, dia);
        if (fechaAct >= hoy) proximasActividades.push(act);

    const proximosTurnos = misTurnos.filter(t => {

                            `<ul style="margin:0; padding-left:1.2rem;">${proximosTurnos.map(t => `<li><strong>${t.fecha}</strong></li>`).join('')}</ul>`

                                ${actividad.descripcion ? escapeHtml(actividad.descripcion) : ''}

                document.getElementById('selectedDateInfo').innerHTML = info;
            } else {
                document.getElementById('myShiftDetail').style.display = 'none';
            }
        }
    });

leElem.style.width="0%"; } requestAnimationFrame(detectPitch); }; detectPitch(); }).catch(()=>{ if(noteElem) noteElem.innerText="Permiso denegado"; }); }

function generarEstrellasGemini() {
    const cont = document.getElementById('starsContainer');
    if (!cont) return;
    cont.innerHTML = '';
    for (let i = 0; i < 30; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 3 + 1;
        star.style.cssText = `width:${size}px; height:${size}px; top:${Math.random()*100}%; left:${Math.random()*100}%; animation-delay:${Math.random()*3}s; animation-duration:${2+Math.random()*3}s;`;
        cont.appendChild(star);
    }
}

async function construirJuegoBienvenida() {
    const wrap = document.getElementById('wlGameOptions');
    if (!wrap) return;
    
    // Verificar si ya respondió hoy
    const hoy = new Date().toISOString().slice(0,10);
    const { data: yaRespondio } = await supabaseClient
        .from('reto_diario')
        .select('fecha')
        .eq('user_id', currentUser.id)
        .eq('fecha', hoy)
        .single();
    
    if (yaRespondio) {
        // Mostrar mensaje en lugar del juego
        wrap.innerHTML = `<div class="text-center text-slate-300 text-sm py-2">✅ Ya participaste hoy. ¡Vuelve mañana para más XP!</div>`;
        document.querySelector('#wlGameCard .av-today-icon')?.parentElement?.removeEventListener('click', toggleWelcomeGame);
        return;
    }
    
    wrap.innerHTML = '';
    const opts = ["En templos lujosos", "En espíritu y en verdad", "Solo los días domingos", "Mediante ritos antiguos"];
    opts.forEach((opt, i) => {
        const div = document.createElement('div');
        div.className = 'wl-game-opt';
        div.textContent = opt;
        div.onclick = () => evaluarBienvenidaGemini(i, div);
        wrap.appendChild(div);
    });
}

async function cargarTriviaDiaria() {
    const container = document.getElementById('av-welcome-game2'); // lo crearemos en el HTML
    if (!container) return;
    
    const hoy = new Date().toISOString().slice(0,10);
    // Verificar si ya respondió la trivia hoy
    const { data: yaRespondio } = await supabaseClient
        .from('respuestas_preguntas_diarias')
        .select('id')
        .eq('user_id', currentUser.id)
        .eq('fecha', hoy)
        .single();
    
    if (yaRespondio) {
        container.innerHTML = `<div class="text-slate-300 text-xs text-center">📖 Trivia bíblica: ya la completaste hoy. +10 XP ganados.</div>`;
        return;
    }
    
    // Obtener una pregunta aleatoria (puede ser fija por día usando el día del año como semilla)
    const { data: preguntas } = await supabaseClient
        .from('preguntas_biblicas_diarias')
        .select('*');
    if (!preguntas || preguntas.length === 0) return;
    
    // Usar el día del año para elegir siempre la misma pregunta para todos (opcional)
    const ahora = new Date();
    const inicio = new Date(ahora.getFullYear(), 0, 0);
    const diaDelAnio = Math.floor((ahora - inicio) / (1000 * 60 * 60 * 24));
    const pregunta = preguntas[diaDelAnio % preguntas.length];
    
    container.innerHTML = `
        <div class="mt-3 p-3 bg-slate-800/50 rounded-lg">
            <p class="text-xs font-bold text-amber-400">🎲 TRIVIA BÍBLICA DEL DÍA</p>
            <p class="text-sm text-white my-2">${pregunta.pregunta}</p>
            <div class="grid grid-cols-2 gap-2 text-xs">
                <button class="trivia-opt bg-slate-700 p-2 rounded hover:bg-amber-600 transition" data-opcion="A">A) ${pregunta.opcion_a}</button>
                <button class="trivia-opt bg-slate-700 p-2 rounded hover:bg-amber-600 transition" data-opcion="B">B) ${pregunta.opcion_b}</button>
                <button class="trivia-opt bg-slate-700 p-2 rounded hover:bg-amber-600 transition" data-opcion="C">C) ${pregunta.opcion_c}</button>
                <button class="trivia-opt bg-slate-700 p-2 rounded hover:bg-amber-600 transition" data-opcion="D">D) ${pregunta.opcion_d}</button>
            </div>
            <div id="triviaFeedback" class="text-xs mt-2 text-center"></div>
        </div>
    `;
    
    document.querySelectorAll('.trivia-opt').forEach(btn => {
        btn.onclick = async (e) => {
            if (btn.disabled) return;
            const seleccion = btn.getAttribute('data-opcion');
            const esCorrecta = (seleccion === pregunta.respuesta_correcta);
            const fb = document.getElementById('triviaFeedback');
            if (esCorrecta) {
                fb.innerHTML = '✅ ¡Correcto! +10 XP';
                await agregarXPGemini(10);
                confetti({ particleCount: 50, spread: 40, origin: { y: 0.7 }, colors: ['#C8972A'] });
            } else {
                fb.innerHTML = `❌ Incorrecto. La respuesta era ${pregunta.respuesta_correcta}. ¡Sigue estudiando!`;
            }
            // Guardar respuesta
            await supabaseClient.from('respuestas_preguntas_diarias').insert({
                user_id: currentUser.id,
                pregunta_id: pregunta.id,
                fecha: hoy,
                es_correcta: esCorrecta
            });
            // Deshabilitar botones
            document.querySelectorAll('.trivia-opt').forEach(b => { b.disabled = true; b.style.opacity = '0.5'; });
        };
    });
}

async function evaluarBienvenidaGemini(idx, el) {
    if (juegoBienvenidaRespondido) return;
    
    // Verificar si ya respondió hoy
    const hoy = new Date().toISOString().slice(0,10);
    const { data: yaRespondio, error } = await supabaseClient
        .from('reto_diario')
        .select('fecha')
        .eq('user_id', currentUser.id)
        .eq('fecha', hoy)
        .single();
    
    if (yaRespondio) {
        alert("Ya respondiste el reto de hoy. Vuelve mañana para más XP.");
        return;
    }
    
    juegoBienvenidaRespondido = true;
    const fb = document.getElementById('wlGameFeedback');
    
    if (idx === 1) { // Respuesta correcta
        el.classList.add('correct');
        fb.textContent = '¡Excelente! +20 XP ganados para tu cuenta.';
        
        // Obtener racha actual y última fecha de respuesta del reto
        const { data: progreso } = await supabaseClient
            .from('progreso_usuario')
            .select('racha, ultimo_reto_fecha')
            .eq('user_id', currentUser.id)
            .single();
        
        let nuevaRacha = 1;
        if (progreso && progreso.ultimo_reto_fecha) {
            const ultimaFecha = new Date(progreso.ultimo_reto_fecha);
            const ayer = new Date();
            ayer.setDate(ayer.getDate() - 1);
            if (ultimaFecha.toDateString() === ayer.toDateString()) {
                nuevaRacha = (progreso.racha || 0) + 1;
            } else {
                nuevaRacha = 1;
            }
        } else {
            nuevaRacha = 1;
        }
        
        // Actualizar XP y racha
        await agregarXPGemini(20);
        rachaGemini = nuevaRacha;
        await supabaseClient.from('progreso_usuario').update({
            racha: nuevaRacha,
            ultimo_reto_fecha: hoy
        }).eq('user_id', currentUser.id);
        await verificarLogros();
        
        // Actualizar UI de racha en la pantalla de bienvenida y en el tablero
        const welcomeRacha = document.getElementById('welcomeRacha');
        if (welcomeRacha) welcomeRacha.innerText = nuevaRacha;
        const rachaTablero = document.querySelector('#tab-inicio .text-orange-500');
        if (rachaTablero) rachaTablero.innerText = nuevaRacha;
        
        // Registrar que respondió hoy
        await supabaseClient.from('reto_diario').insert({
            user_id: currentUser.id,
            fecha: hoy
        });
        
        confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 }, colors: ['#C8972A', '#1E3A8A'] });
    } else {
        el.classList.add('wrong');
        fb.textContent = 'Respuesta incorrecta. Juan 4:23 nos llama a adorar en Espíritu y Verdad.';
        // No suma XP, pero igual marcamos que respondió para que no pueda volver a intentar hoy
        await supabaseClient.from('reto_diario').insert({
            user_id: currentUser.id,
            fecha: hoy
        });
    }
    document.querySelectorAll('.wl-game-opt').forEach(opt => opt.style.pointerEvents = 'none');
}

// Verificar y otorgar logros según XP y racha actual
async function verificarLogros() {
    if (!currentUser) return;
    
    // Obtener progreso del usuario (XP y racha)
    const { data: progreso, error: progError } = await supabaseClient
        .from('progreso_usuario')
        .select('xp, racha')
        .eq('user_id', currentUser.id)
        .single();
    if (progError || !progreso) return;
    
    // Obtener logros ya obtenidos por el usuario
    const { data: logrosObtenidos, error: logError } = await supabaseClient
        .from('logros_usuarios')
        .select('logro_id')
        .eq('user_id', currentUser.id);
    if (logError) return;
    
    const idsObtenidos = (logrosObtenidos || []).map(l => l.logro_id);
    
    // Obtener todos los logros disponibles
    const { data: todosLogros, error: allError } = await supabaseClient
        .from('logros')
        .select('*');
    if (allError || !todosLogros) return;
    
    let nuevosLogros = [];
    
    for (const logro of todosLogros) {
        if (idsObtenidos.includes(logro.id)) continue;
        
        let cumple = false;
        if (logro.requisito_xp && progreso.xp >= logro.requisito_xp) cumple = true;
        if (logro.requisito_racha && progreso.racha >= logro.requisito_racha) cumple = true;
        
        if (cumple) {
            // Insertar logro
            const { error: insertError } = await supabaseClient
                .from('logros_usuarios')
                .insert({
                    user_id: currentUser.id,
                    logro_id: logro.id
                });
            if (!insertError) {
                nuevosLogros.push(logro);
            }
        }
    }
    
    // Mostrar notificaciones para cada nuevo logro
    for (const logro of nuevosLogros) {
        mostrarNotificacionLogro(logro);
    }
    
    // Si hay nuevos logros, refrescar el panel si está visible
    if (nuevosLogros.length > 0 && document.getElementById('logrosPanel')) {
        mostrarLogrosEnPanel();
    }
}

// Mostrar notificación bonita (modal o toast)
function mostrarNotificacionLogro(logro) {
    // Crear un toast flotante
    const toast = document.createElement('div');
    toast.className = 'fixed bottom-4 right-4 bg-gradient-to-r from-amber-500 to-yellow-600 text-white p-4 rounded-lg shadow-xl z-50 flex items-center gap-3 animate-bounce';
    toast.innerHTML = `
        <span class="text-3xl">${logro.icono || '🏆'}</span>
        <div>
            <p class="font-bold text-sm">¡NUEVO LOGRO DESBLOQUEADO!</p>
            <p class="text-sm font-semibold">${logro.nombre}</p>
            <p class="text-xs opacity-90">${logro.descripcion}</p>
        </div>
        <button class="ml-2 text-white hover:text-gray-200" onclick="this.parentElement.remove()">✕</button>
    `;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 5000);
    
    // Opcional: confeti
    if (typeof confetti === 'function') {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    }
}

window.responderRetoGemini = async (id) => {
    const { data: reto } = await supabaseClient.from('desafios').select('*').eq('id', id).single();

    const respuesta = prompt(`Responde el desafío de ${reto.de_usuario_id}:\n\n${reto.pregunta}`);

    const normalizar = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();

        alert('❌ Respuesta incorrecta. Sigue intentando.');
        return;
    }
    await supabaseClient.from('desafios').update({ estado: 'completado', respuesta_usuario: respuesta, fecha_respuesta: new Date().toISOString() }).eq('id', id);
    await agregarXPGemini(50);
    alert('🎉 ¡Correcto! +50 XP');
    await cargarRetosGemini();
    await agregarXPGemini(50);
await verificarLogros();
};

async function startExam(examenId) { const { data: existing } = await supabaseClient.from('intentos_examen').select('*').eq('user_id',currentUser.id).eq('examen_id',examenId).single(); if(existing){ alert("Ya completaste este examen."); return; } const qs = preguntas.filter(q=>q.examen_id===examenId).sort((a,b)=>a.orden_index-b.orden_index); if(qs.length===0){ alert("Este examen no tiene preguntas."); return; } examQuestions=qs; examCurrentIndex=0; examScore=0; currentExamId=examenId; document.getElementById('examOverlay').style.display='block'; respuestasExamen = [];examScore = 0; loadExamQuestion(); }

   function loadExamQuestion() {
  if (examCurrentIndex >= examQuestions.length) {
    finishExam();
    return;
}

  const q = examQuestions[examCurrentIndex];
  document.getElementById('examProgressTitle').innerText = `Pregunta ${examCurrentIndex + 1} de ${examQuestions.length}`;
  document.getElementById('examQuestionText').innerText = q.enunciado;

  let optionsHtml = '';
  let isMulti = false;   // bandera para saber si es múltiple respuesta

  // 1. Generar el HTML de opciones según el tipo
  if (q.tipo === 'vf') {
    optionsHtml = `
      <button class="option-btn" data-value="V" onclick="selectExamOption('V', this)"><strong>Verdadero</strong></button>
      <button class="option-btn" data-value="F" onclick="selectExamOption('F', this)"><strong>Falso</strong></button>
      <div style="margin-top: 1rem;">
        <button class="btn btn-primary" onclick="submitSelectedAnswer()">Responder</button>
      </div>
    `;
  } 
  else if (q.tipo === 'completar') {
    optionsHtml = `
      <input type="text" id="completarInput" class="form-control" placeholder="Escribe tu respuesta">
      <div style="margin-top: 1rem;">
        <button class="btn btn-primary" onclick="submitCompletar()">Responder</button>
      </div>
    `;
    // Definir manejador para completar
    window.submitCompletar = () => {
      clearInterval(examTimer);
      const currentQ = examQuestions[examCurrentIndex];
      const respuestaUsuario = document.getElementById('completarInput').value.trim();
      const esCorrecta = (respuestaUsuario.toLowerCase() === currentQ.opcion_correcta.toLowerCase());
      if (esCorrecta) examScore++;
      respuestasExamen.push({
        preguntaIndex: examCurrentIndex,
        respuesta: respuestaUsuario,
        esCorrecta: esCorrecta,
        pregunta: currentQ.enunciado,
        correctaEsperada: currentQ.opcion_correcta,
        tipo: 'completar'
      });
      examCurrentIndex++;
      loadExamQuestion();
    };
  } 
  else if (q.tipo === 'multiple') {
    // Detectar si es selección múltiple (más de una letra en opcion_correcta)
    isMulti = (q.opcion_correcta && q.opcion_correcta.length > 1);
    if (isMulti) {
      // Checkboxes para múltiples respuestas
      optionsHtml = `
        <div class="multi-options">
          <label class="option-btn" style="display: block; text-align: left;"><input type="checkbox" value="A"> <strong>A.</strong> ${escapeHtml(q.opcion_a)}</label>
          <label class="option-btn" style="display: block; text-align: left;"><input type="checkbox" value="B"> <strong>B.</strong> ${escapeHtml(q.opcion_b)}</label>
          <label class="option-btn" style="display: block; text-align: left;"><input type="checkbox" value="C"> <strong>C.</strong> ${escapeHtml(q.opcion_c)}</label>
          <label class="option-btn" style="display: block; text-align: left;"><input type="checkbox" value="D"> <strong>D.</strong> ${escapeHtml(q.opcion_d)}</label>
        </div>
        <div style="margin-top: 1rem;">
          <button class="btn btn-primary" onclick="submitMultiAnswer()">Responder</button>
        </div>
      `;
      // Definir manejador para múltiple
      window.submitMultiAnswer = () => {
        clearInterval(examTimer);
        const currentQ = examQuestions[examCurrentIndex];
        const checkboxes = document.querySelectorAll('.multi-options input:checked');
        const selectedLetters = Array.from(checkboxes).map(cb => cb.value).sort().join('');
        const correctLetters = currentQ.opcion_correcta.split('').sort().join('');
        const esCorrecta = (selectedLetters === correctLetters);
        if (esCorrecta) examScore++;
        respuestasExamen.push({
          preguntaIndex: examCurrentIndex,
          respuesta: selectedLetters,
          esCorrecta: esCorrecta,
          pregunta: currentQ.enunciado,
          opciones: {
            a: currentQ.opcion_a,
            b: currentQ.opcion_b,
            c: currentQ.opcion_c,
            d: currentQ.opcion_d
          },
          correctaEsperada: currentQ.opcion_correcta,
          tipo: 'multiple'
        });
        examCurrentIndex++;
        loadExamQuestion();
      };
    } else {
      // Selección simple (una sola letra correcta)
      optionsHtml = `
        <button class="option-btn" data-value="A" onclick="selectExamOption('A', this)"><strong>A.</strong> ${escapeHtml(q.opcion_a)}</button>
        <button class="option-btn" data-value="B" onclick="selectExamOption('B', this)"><strong>B.</strong> ${escapeHtml(q.opcion_b)}</button>
        <button class="option-btn" data-value="C" onclick="selectExamOption('C', this)"><strong>C.</strong> ${escapeHtml(q.opcion_c)}</button>
        <button class="option-btn" data-value="D" onclick="selectExamOption('D', this)"><strong>D.</strong> ${escapeHtml(q.opcion_d)}</button>
        <div style="margin-top: 1rem;">
          <button class="btn btn-primary" onclick="submitSelectedAnswer()">Responder</button>
        </div>
      `;
    }
  }

  // 2. Insertar las opciones en el DOM
  document.getElementById('examOptionsContainer').innerHTML = optionsHtml;
  selectedOption = null;

  // 3. Configurar el temporizador (común para todos los tipos)
  const timeLimit = q.tiempo_segundos || 15;
  examTimeLeft = timeLimit;
  document.getElementById('examTimerDisplay').innerText = `${examTimeLeft}s`;
  document.getElementById('timerBarFill').style.width = '100%';

  if (examTimer) clearInterval(examTimer);
  examTimer = setInterval(() => {
    examTimeLeft--;
    document.getElementById('examTimerDisplay').innerText = `${examTimeLeft}s`;
    const percent = (examTimeLeft / timeLimit) * 100;
    document.getElementById('timerBarFill').style.width = `${Math.max(0, percent)}%`;

    if (examTimeLeft <= 0) {
      clearInterval(examTimer);
      // Según el tipo, ejecutar la acción correspondiente al terminar el tiempo
      if (q.tipo === 'completar') {
        // Si no respondió, pasar sin sumar (guardar como incorrecta)
        const currentQ = examQuestions[examCurrentIndex];
        respuestasExamen.push({
          preguntaIndex: examCurrentIndex,
          respuesta: null,
          esCorrecta: false,
          pregunta: currentQ.enunciado,
          tipo: 'completar'
        });
        examCurrentIndex++;
        loadExamQuestion();
      } 
      else if (q.tipo === 'multiple' && isMulti) {
        // Para múltiple, llamamos a submitMultiAnswer (que ya guarda respuestas)
        // Pero si el tiempo expira sin marcar nada, submitMultiAnswer guardará cadena vacía
        window.submitMultiAnswer();
      } 
      else {
        // Para vf, multiple simple: guardamos respuesta vacía (incorrecta) y avanzamos
        const currentQ = examQuestions[examCurrentIndex];
        respuestasExamen.push({
          preguntaIndex: examCurrentIndex,
          respuesta: null,
          esCorrecta: false,
          pregunta: currentQ.enunciado,
          tipo: currentQ.tipo || 'multiple'
        });
        examCurrentIndex++;
        loadExamQuestion();
      }
    }
  }, 1000);

  // 4. Definir funciones auxiliares (globales o locales)
  window.selectExamOption = (letter, element) => {
    selectedOption = letter;
    document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
    element.classList.add('selected');
  };

  window.submitSelectedAnswer = () => {
    if (selectedOption === null) {
      alert("Por favor, selecciona una respuesta antes de continuar.");
      return;
    }
    clearInterval(examTimer);
    const currentQ = examQuestions[examCurrentIndex];
    const esCorrecta = (selectedOption === currentQ.opcion_correcta);
    if (esCorrecta) examScore++;
    // Guardar respuesta
    respuestasExamen.push({
      preguntaIndex: examCurrentIndex,
      respuesta: selectedOption,
      esCorrecta: esCorrecta,
      pregunta: currentQ.enunciado,
      opciones: {
        a: currentQ.opcion_a,
        b: currentQ.opcion_b,
        c: currentQ.opcion_c,
        d: currentQ.opcion_d
      },
      correctaEsperada: currentQ.opcion_correcta,
      tipo: currentQ.tipo
    });
    examCurrentIndex++;
    loadExamQuestion();
  };
}

  async function finishExam() {
  const notaFinal = (examScore / examQuestions.length) * 20;
  const notaRedondeada = Math.round(notaFinal * 100) / 100;
  const aprobado = notaRedondeada >= 14;

  // Guardar en Supabase (con las respuestas)
  const { error } = await supabaseClient.from('intentos_examen').insert({
    user_id: currentUser.id,
    examen_id: currentExamId,
    puntaje: notaRedondeada,
    respuestas: JSON.stringify(respuestasExamen),
    completado: true
  });

  if (error) {
    console.error("Error al guardar el examen:", error);
    alert("Error al guardar: " + error.message);
    return;
  }

  const mensajeEstado = aprobado ? '✅ APROBADO' : '❌ REPROBADO';
  const colorEstado = aprobado ? '#10B981' : '#EF4444';
  
  const modalContent = `
    <div style="text-align: center;">
      <h2>Resultado del Examen</h2>
      <p style="font-size: 2rem; font-weight: bold; color: ${colorEstado};">${notaRedondeada} / 20</p>
      <p style="font-size: 1.2rem;">${mensajeEstado}</p>
      <p>Respuestas correctas: ${examScore} de ${examQuestions.length}</p>
      <hr style="margin: 1rem 0;">
      <button class="btn btn-primary" onclick="mostrarRevisionExamen()">📋 Revisar mis respuestas</button>
        </div><div style="text-align: right; margin-top: 1rem;">
            <button class="btn btn-ghost" onclick="cerrarExamenCompleto()">Cerrar</button>
          </div>
  `;
  showModal(modalContent);
     // Recargar el tablero principal para actualizar el promedio
if (currentTab === 'moodle') {
    // Esperar a que se cierre el modal y luego recargar
    const modal = document.getElementById('modal');
    if (modal) {
        const observer = new MutationObserver(() => {
            if (!modal.isConnected) {
                cargarInicioGemini();
                observer.disconnect();
            }
        });
        observer.observe(document.body, { childList: true, subtree: true });
    }
} 

  // No limpiar aquí, se limpiará al cerrar el modal
  // Ocultar el overlay del examen (pantalla de preguntas)
  document.getElementById('examOverlay').style.display = 'none';
} 
    


function mostrarRevisionExamen() {
  if (!respuestasExamen || respuestasExamen.length === 0) {
    alert("No hay respuestas guardadas para revisar.");
    return;
  }

  let html = `<h3>📝 Revisión del Examen</h3>
              <div style="max-height: 60vh; overflow-y: auto; padding-right: 0.5rem;">`;

  respuestasExamen.forEach((item, idx) => {
    const num = idx + 1;
    const acierto = item.esCorrecta ? '✅ Correcta' : '❌ Incorrecta';
    const color = item.esCorrecta ? '#10B981' : '#EF4444';

    html += `<div class="card" style="margin-bottom: 1rem; padding: 0.8rem;">
              <div style="display: flex; justify-content: space-between;">
                <strong>Pregunta ${num}</strong>
                <span style="color: ${color}; font-weight: bold;">${acierto}</span>
              </div>
              <p style="margin-top: 0.5rem;">${escapeHtml(item.pregunta)}</p>`;

    if (item.tipo === 'completar') {
      html += `<p><strong>Tu respuesta:</strong> ${escapeHtml(item.respuesta || '(no respondida)')}</p>
               <p><strong>Respuesta correcta:</strong> ${escapeHtml(item.correctaEsperada)}</p>`;
    } 
    else if (item.tipo === 'multiple' && item.opciones) {
      html += `<p><strong>Opciones:</strong><br>
               A) ${escapeHtml(item.opciones.a)}<br>
               B) ${escapeHtml(item.opciones.b)}<br>
               C) ${escapeHtml(item.opciones.c)}<br>
               D) ${escapeHtml(item.opciones.d)}</p>`;
      html += `<p><strong>Tu selección:</strong> ${item.respuesta ? item.respuesta.split('').join(', ') : '(ninguna)'}</p>
               <p><strong>Respuesta(s) correcta(s):</strong> ${item.correctaEsperada.split('').join(', ')}</p>`;
    }
    else {
      html += `<p><strong>Tu respuesta:</strong> ${item.respuesta || '(no respondida)'}</p>
               <p><strong>Respuesta correcta:</strong> ${item.correctaEsperada}</p>`;
    }

    html += `</div>`;
  });

  html += `</div><div style="text-align: right; margin-top: 1rem;">
            <button class="btn btn-ghost" onclick="cerrarExamenCompleto()">Cerrar</button>
          </div>`;

  showModal(html);
}
    
async function verDetalleExamen(examenId) {

        .eq('user_id', currentUser.id)
        .eq('examen_id', examenId)

async function saveUserProfileWithPhoto() {
    const nombre = document.getElementById('editNombre').value.trim();
    const telefono = document.getElementById('editTelefono').value.trim();
    const fecha = document.getElementById('editFecha').value;
    const direccion = document.getElementById('editDireccion').value.trim();
    const tema = document.getElementById('editTema').value;
    const fotoFile = document.getElementById('editFotoFile').files[0];

    let foto_url = currentProfile.foto_url;

    if (fotoFile) {
        const fileExt = fotoFile.name.split('.').pop();
        const fileName = `${currentUser.id}/${Date.now()}.${fileExt}`;
        const { error: uploadError } = await supabaseClient.storage
            .from('avatars')
            .upload(fileName, fotoFile);
        if (uploadError) {
            alert('Error al subir la foto: ' + uploadError.message);
            return;
        }
        const { data: urlData } = supabaseClient.storage.from('avatars').getPublicUrl(fileName);
        foto_url = urlData.publicUrl;
    }

    const { error } = await supabaseClient
        .from('perfiles')
        .update({
            nombre,
            telefono,
            fecha_nacimiento: fecha,
            direccion,
            foto_url,
            tema
        })
        .eq('id', currentUser.id);

    if (error) {
        alert('Error al guardar: ' + error.message);
        return;
    }

    aplicarTema(tema);
    alert('✅ Perfil actualizado correctamente');
    closeModal();
    await loadProfile();
    await loadUserData();
    renderUserProfile();
}
function aplicarTema(tema) {
    const root = document.documentElement;
    switch (tema) {
        case 'verde':
            root.style.setProperty('--primary', '#065F46');
            root.style.setProperty('--primary-light', '#10B981');
            root.style.setProperty('--primary-rgb', '6,95,70');
            break;
        case 'morado':
            root.style.setProperty('--primary', '#5B21B6');
            root.style.setProperty('--primary-light', '#8B5CF6');
            root.style.setProperty('--primary-rgb', '91,33,182');
            break;
        case 'rosa':
            root.style.setProperty('--primary', '#BE185D');
            root.style.setProperty('--primary-light', '#F472B6');
            root.style.setProperty('--primary-rgb', '190,24,93');
            break;
        case 'naranja':
            root.style.setProperty('--primary', '#C2410C');
            root.style.setProperty('--primary-light', '#F97316');
            root.style.setProperty('--primary-rgb', '194,65,12');
            break;
        default:
            root.style.setProperty('--primary', '#1E3A8A');
            root.style.setProperty('--primary-light', '#3B82F6');
            root.style.setProperty('--primary-rgb', '30,58,138');
            break;
    }
}

// NUEVA FUNCIÓN: adminUserManagement con selector jerárquico (departamento padre + equipo hijo)
async function adminUserManagement() {
    if (!currentIglesiaId) {
        alert("Primero selecciona una iglesia en el panel de administración.");
        return;
    }

    // Obtener usuarios de la iglesia actual
    const { data: miembrosData, error } = await supabaseClient
        .from('usuarios_iglesia')
        .select('*, perfiles(nombre, email, rol)')
        .eq('iglesia_id', currentIglesiaId);
    if (error) return alert("Error: " + error.message);

    // Obtener el ID del departamento GENERAL
    const generalDepto = departamentos.find(d => d.nombre === 'GENERAL' && d.padre_id === null);
    if (!generalDepto) {
        alert("No se encontró el departamento GENERAL. Crea los departamentos primero.");
        return;
    }
    const generalId = generalDepto.id;

    // Áreas = departamentos cuyo padre_id es GENERAL (excluyendo al propio GENERAL)
    const areas = departamentos.filter(d => d.padre_id === generalId);
    // Equipos = departamentos que tienen padre_id distinto de null y distinto de generalId
    const equipos = departamentos.filter(d => d.padre_id !== null && d.padre_id !== generalId);
    // Mapa de equipos por área
    const equiposPorArea = {};
    equipos.forEach(e => {
        if (!equiposPorArea[e.padre_id]) equiposPorArea[e.padre_id] = [];
        equiposPorArea[e.padre_id].push(e);
    });

    let html = `<h3>📋 Gestión de Usuarios Registrados (${currentIglesiaData?.nombre})</h3>
                <div style="display:flex; flex-direction:column; gap:1rem;">`;

    for (let m of miembrosData) {
        const perfil = m.perfiles;
        const rolMusical = m.rol_musical || 'Por asignar';
        const deptoActual = m.departamento_id || '';
        // Determinar si el depto actual es un área o un equipo
        const deptoActualObj = departamentos.find(d => d.id === deptoActual);
        const esArea = deptoActualObj && deptoActualObj.padre_id === generalId;
        const esEquipo = deptoActualObj && deptoActualObj.padre_id !== null && deptoActualObj.padre_id !== generalId;
        const areaActual = esEquipo ? deptoActualObj.padre_id : (esArea ? deptoActual : '');
        const equipoActual = esEquipo ? deptoActual : '';
        const esAdminIglesia = m.es_admin_iglesia || false;
        const esAdminDepto = m.es_admin_departamento || false;

        html += `<div class="card" style="padding:1rem;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
                <div style="flex:1;">
                    <div class="form-group" style="margin:0;">
                        <label>Nombre completo</label>
                        <input type="text" id="nombre_${m.id}" class="form-control" value="${escapeHtml(perfil?.nombre || '')}" placeholder="Nombre del usuario">
                    </div>
                    <small>${escapeHtml(perfil?.email)}</small>
                </div>
                ${isAdminUser ? `<button class="btn-icon" onclick="deleteUserById('${m.user_id}')" style="color:red;" title="Eliminar usuario"><i class="fas fa-trash"></i></button>` : ''}
            </div>
            <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:0.8rem; margin-top:1rem;">
                <div class="form-group">
                    <label>Rol en app</label>
                    <select id="rol_${m.id}" class="form-control">
                        <option value="user" ${perfil?.rol === 'user' ? 'selected' : ''}>Usuario normal</option>
                        <option value="admin" ${perfil?.rol === 'admin' ? 'selected' : ''}>Administrador (global)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Departamento (Área)</label>
                    <select id="area_${m.id}" class="form-control" onchange="cargarEquipos('${m.id}')">
                        <option value="">Sin área</option>
                        ${areas.map(a => `<option value="${a.id}" ${areaActual === a.id ? 'selected' : ''}>${escapeHtml(a.nombre)}</option>`).join('')}
                    </select>
                </div>
                <div class="form-group">
                    <label>Equipo (Subdepartamento)</label>
                    <select id="equipo_${m.id}" class="form-control">
                        <option value="">Selecciona un equipo</option>
                        ${areaActual && equiposPorArea[areaActual] ? equiposPorArea[areaActual].map(e => `<option value="${e.id}" ${equipoActual === e.id ? 'selected' : ''}>${escapeHtml(e.nombre)}</option>`).join('') : ''}
                    </select>
                </div>
                <div class="form-group">
                    <label>Rol musical</label>
                    <select id="rolMusical_${m.id}" class="form-control">
                        <option value="">Sin rol</option>
                        <option value="Voz" ${rolMusical === 'Voz' ? 'selected' : ''}>Voz</option>
                        <option value="Batería" ${rolMusical === 'Batería' ? 'selected' : ''}>Batería</option>
                        <option value="Bajo" ${rolMusical === 'Bajo' ? 'selected' : ''}>Bajo</option>
                        <option value="Guitarra" ${rolMusical === 'Guitarra' ? 'selected' : ''}>Guitarra</option>
                        <option value="Teclado" ${rolMusical === 'Teclado' ? 'selected' : ''}>Teclado</option>
                        <option value="Percusión" ${rolMusical === 'Percusión' ? 'selected' : ''}>Percusión</option>
                        <option value="Otro" ${rolMusical === 'Otro' ? 'selected' : ''}>Otro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><input type="checkbox" id="adminIglesia_${m.id}" ${esAdminIglesia ? 'checked' : ''}> Administrador de iglesia</label>
                </div>
                <div class="form-group">
                    <label><input type="checkbox" id="adminDepto_${m.id}" ${esAdminDepto ? 'checked' : ''}> Administrador de departamento</label>
                </div>
            </div>
            <div style="margin-top:1rem; text-align:right;">
                <button class="btn btn-primary" onclick="updateUserByAdminNuevo('${m.id}', '${m.user_id}')">Guardar cambios</button>
            </div>
        </div>`;

        // Registrar función global para cargar equipos según el área seleccionada
        window[`cargarEquipos_${m.id}`] = function() {
            const areaId = document.getElementById(`area_${m.id}`).value;
            const equipoSelect = document.getElementById(`equipo_${m.id}`);
            if (!areaId) {
                equipoSelect.innerHTML = '<option value="">Selecciona un equipo</option>';
                return;
            }
            const equiposLista = equiposPorArea[areaId] || [];
            equipoSelect.innerHTML = '<option value="">Selecciona un equipo</option>' +
                equiposLista.map(e => `<option value="${e.id}">${escapeHtml(e.nombre)}</option>`).join('');
        };
    }
    html += `</div><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>`;
    showModal(html);

    // Adjuntar eventos onchange a los selectores de área
    for (let m of miembrosData) {
        const areaSelect = document.getElementById(`area_${m.id}`);
        if (areaSelect) {
            areaSelect.onchange = () => {
                const fn = window[`cargarEquipos_${m.id}`];
                if (fn) fn();
            };
        }
    }
}

window.updateUserByAdminNuevo = async (miembroId, userId) => {
