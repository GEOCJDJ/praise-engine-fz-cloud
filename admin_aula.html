<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin | Aula Virtual G-Praise</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body { background: #F1F5F9; }
    .admin-sidebar-item { cursor: pointer; transition: 0.2s; }
    .admin-sidebar-item.active { background: #1E293B; border-left-color: #C8972A; }
  </style>
</head>
<body>
<div style="display: flex; height: 100vh;">
  <aside style="width: 260px; background: #0F172A; color: white;">
    <div style="padding: 1.5rem; border-bottom: 1px solid #1E293B;">
      <h1 class="font-bold">G-PANEL ADM</h1>
      <p class="text-xs text-amber-500">Aula Virtual</p>
    </div>
    <nav>
      <div class="admin-sidebar-item active" data-section="cursos" style="padding: 0.85rem 1.5rem; border-left: 4px solid #C8972A;">📚 Cursos y Módulos</div>
      <div class="admin-sidebar-item" data-section="examenes" style="padding: 0.85rem 1.5rem; border-left: 4px solid transparent;">📝 Exámenes y Preguntas</div>
      <div class="admin-sidebar-item" data-section="tareas" style="padding: 0.85rem 1.5rem; border-left: 4px solid transparent;">📋 Tareas</div>
      <div class="admin-sidebar-item" data-section="devocionales" style="padding: 0.85rem 1.5rem; border-left: 4px solid transparent;">🙏 Devocionales</div>
    </nav>
  </aside>
  <main style="flex: 1; overflow-y: auto; padding: 1.5rem;">
    <div id="adminContent">Cargando...</div>
  </main>
</div>

<script>
  const SUPABASE_URL = 'https://mudcrmgaqejmpyeyocmt.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11ZGNybWdhcWVqbXB5ZXlvY210Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3OTg2MzUsImV4cCI6MjA5NDM3NDYzNX0.Izf3hp-JHgkWH00kEpSMitSo61pMtGeQh-6PimhcNIU';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let currentIglesiaId = null;
  let currentUser = null;

  (async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { document.getElementById('adminContent').innerHTML = '<p class="text-red-500">No has iniciado sesión. Cierra y abre desde la app principal.</p>'; return; }
    currentUser = session.user;
    const { data: userIglesia } = await supabase.from('usuarios_iglesia').select('iglesia_id').eq('user_id', currentUser.id).single();
    if (userIglesia) currentIglesiaId = userIglesia.iglesia_id;
    else { alert("No perteneces a ninguna iglesia."); return; }
    renderSection('cursos');
    document.querySelectorAll('.admin-sidebar-item').forEach(el => {
      el.addEventListener('click', () => {
        document.querySelectorAll('.admin-sidebar-item').forEach(e => e.classList.remove('active'));
        el.classList.add('active');
        renderSection(el.getAttribute('data-section'));
      });
    });
  })();

  async function renderSection(section) {
    if (section === 'cursos') await renderCursos();
    if (section === 'examenes') await renderExamenes();
    if (section === 'tareas') await renderTareas();
    if (section === 'devocionales') await renderDevocionales();
  }

  async function renderCursos() {
    const { data: cursos } = await supabase.from('cursos').select('*').eq('entidad_id', currentIglesiaId);
    let html = `<div class="bg-white p-4 rounded-lg shadow mb-4"><h2 class="font-bold mb-2">Crear Nuevo Curso</h2>
      <input type="text" id="cursoTitulo" class="border p-2 w-full mb-2 rounded" placeholder="Título">
      <textarea id="cursoDesc" class="border p-2 w-full mb-2 rounded" placeholder="Descripción"></textarea>
      <input type="text" id="cursoTag" class="border p-2 w-full mb-2 rounded" placeholder="Etiqueta (ej. Teología)">
      <button onclick="crearCurso()" class="bg-emerald-600 text-white px-4 py-2 rounded">Crear Curso</button>
    </div><div class="space-y-2">`;
    for (let c of cursos || []) {
      const { data: modulos } = await supabase.from('modulos').select('*').eq('curso_id', c.id);
      html += `<div class="bg-white p-4 rounded-lg shadow">
        <div class="flex justify-between"><div><h3 class="font-bold">${c.titulo}</h3><p class="text-sm">${c.descripcion || ''}</p><p class="text-xs text-amber-600">${c.tag || ''}</p></div><button onclick="eliminarCurso('${c.id}')" class="text-red-500">Eliminar</button></div>
        <div class="mt-2"><strong>Módulos:</strong> ${modulos.map(m => `<span class="bg-slate-100 px-2 py-1 rounded text-sm">${m.titulo}</span>`).join('')} <button onclick="agregarModulo('${c.id}')" class="text-blue-600 text-sm">+ Añadir módulo</button></div>
      </div>`;
    }
    html += `</div>`;
    document.getElementById('adminContent').innerHTML = html;
  }

  window.crearCurso = async () => {
    const titulo = document.getElementById('cursoTitulo').value.trim();
    if (!titulo) return alert("Título requerido");
    const desc = document.getElementById('cursoDesc').value.trim();
    const tag = document.getElementById('cursoTag').value.trim();
    await supabase.from('cursos').insert({ id: crypto.randomUUID(), titulo, descripcion: desc, tag, entidad_tipo: 'iglesia', entidad_id: currentIglesiaId, creado_por: currentUser.id });
    alert("Curso creado");
    renderCursos();
  };
  window.eliminarCurso = async (id) => {
    if (confirm("¿Eliminar curso y sus módulos?")) {
      await supabase.from('modulos').delete().eq('curso_id', id);
      await supabase.from('cursos').delete().eq('id', id);
      renderCursos();
    }
  };
  window.agregarModulo = async (cursoId) => {
    const titulo = prompt("Título del módulo:");
    if (titulo) await supabase.from('modulos').insert({ id: crypto.randomUUID(), curso_id: cursoId, titulo, orden_index: 1 });
    renderCursos();
  };

  async function renderExamenes() {
    const { data: examenes } = await supabase.from('examenes').select('*, modulos(titulo)');
    let html = `<div class="bg-white p-4 rounded-lg shadow mb-4"><h2 class="font-bold">Crear Examen</h2>
      <input type="text" id="examTitulo" class="border p-2 w-full mb-2 rounded" placeholder="Título">
      <select id="examModulo" class="border p-2 w-full mb-2 rounded">${(await supabase.from('modulos').select('id, titulo')).data?.map(m => `<option value="${m.id}">${m.titulo}</option>`).join('')}</select>
      <input type="number" id="examTiempo" class="border p-2 w-full mb-2 rounded" placeholder="Segundos por pregunta" value="15">
      <button onclick="crearExamen()" class="bg-emerald-600 text-white px-4 py-2 rounded">Crear Examen</button>
    </div><div class="space-y-2">`;
    for (let ex of examenes || []) {
      const { data: preguntas } = await supabase.from('preguntas').select('*').eq('examen_id', ex.id);
      html += `<div class="bg-white p-4 rounded-lg shadow">
        <div class="flex justify-between"><div><h3 class="font-bold">${ex.titulo}</h3><p class="text-xs">Módulo: ${ex.modulos?.titulo} | ⏱️ ${ex.tiempo_por_pregunta}s</p></div><button onclick="eliminarExamen('${ex.id}')" class="text-red-500">Eliminar</button></div>
        <div class="mt-2"><strong>Preguntas:</strong> ${preguntas.length} <button onclick="gestionarPreguntas('${ex.id}')" class="text-blue-600 text-sm ml-2">Gestionar preguntas</button></div>
      </div>`;
    }
    html += `</div>`;
    document.getElementById('adminContent').innerHTML = html;
  }

  window.crearExamen = async () => {
    const titulo = document.getElementById('examTitulo').value.trim();
    const modulo_id = document.getElementById('examModulo').value;
    const tiempo = parseInt(document.getElementById('examTiempo').value) || 15;
    if (!titulo || !modulo_id) return alert("Completa título y módulo");
    await supabase.from('examenes').insert({ id: crypto.randomUUID(), titulo, modulo_id, tiempo_por_pregunta: tiempo });
    alert("Examen creado");
    renderExamenes();
  };
  window.eliminarExamen = async (id) => {
    if (confirm("¿Eliminar examen y preguntas?")) {
      await supabase.from('preguntas').delete().eq('examen_id', id);
      await supabase.from('examenes').delete().eq('id', id);
      renderExamenes();
    }
  };
  window.gestionarPreguntas = async (examenId) => {
    const { data: preguntas } = await supabase.from('preguntas').select('*').eq('examen_id', examenId);
    let modalHtml = `<div><h3>Preguntas</h3><div id="preguntasLista">${preguntas.map(p => `<div class="border p-2 mb-1">${p.enunciado} <button onclick="eliminarPregunta('${p.id}')">🗑️</button></div>`).join('')}</div>
      <input type="text" id="nuevaPregunta" class="border p-2 w-full mt-2" placeholder="Enunciado">
      <div class="grid grid-cols-2 gap-2 mt-2">
        <input type="text" id="opA" placeholder="Opción A (correcta)" class="border p-1">
        <input type="text" id="opB" placeholder="Opción B" class="border p-1">
        <input type="text" id="opC" placeholder="Opción C" class="border p-1">
        <input type="text" id="opD" placeholder="Opción D" class="border p-1">
      </div>
      <button onclick="guardarPregunta('${examenId}')" class="bg-blue-900 text-white px-3 py-1 rounded mt-2">Agregar Pregunta</button>
      <button onclick="closeModal()" class="ml-2">Cerrar</button>
    </div>`;
    showModalAdmin(modalHtml);
  };
  window.guardarPregunta = async (examenId) => {
    const enunciado = document.getElementById('nuevaPregunta').value.trim();
    const opA = document.getElementById('opA').value.trim();
    if (!enunciado || !opA) return alert("Enunciado y opción A son obligatorios");
    await supabase.from('preguntas').insert({
      id: crypto.randomUUID(), examen_id: examenId, enunciado, tipo: 'multiple',
      opcion_a: opA, opcion_b: document.getElementById('opB').value.trim(),
      opcion_c: document.getElementById('opC').value.trim(), opcion_d: document.getElementById('opD').value.trim(),
      opcion_correcta: 'A', tiempo_segundos: 15
    });
    alert("Pregunta agregada");
    closeModal();
    gestionarPreguntas(examenId);
  };
  window.eliminarPregunta = async (id) => {
    if (confirm("¿Eliminar pregunta?")) await supabase.from('preguntas').delete().eq('id', id);
    // Recargar la gestión actual (necesitaríamos guardar el examenId actual, pero por simplicidad cerramos y volvemos a abrir)
    alert("Pregunta eliminada, refresca la lista.");
    closeModal();
  };
  function showModalAdmin(content) {
    const div = document.createElement('div');
    div.className = 'fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4';
    div.innerHTML = `<div class="bg-white rounded-xl max-w-lg w-full p-4 max-h-[80vh] overflow-auto">${content}</div>`;
    document.body.appendChild(div);
    window.closeModal = () => div.remove();
  }

  async function renderTareas() {
    const { data: tareas } = await supabase.from('tareas_aula').select('*').eq('iglesia_id', currentIglesiaId);
    let html = `<div class="bg-white p-4 rounded-lg shadow mb-4"><h2 class="font-bold">Nueva Tarea</h2>
      <input type="text" id="tareaTitulo" class="border p-2 w-full mb-2 rounded" placeholder="Título">
      <textarea id="tareaDesc" class="border p-2 w-full mb-2 rounded" placeholder="Descripción"></textarea>
      <input type="text" id="tareaFecha" class="border p-2 w-full mb-2 rounded" placeholder="Fecha límite (ej. Domingo 15 Jun)">
      <button onclick="crearTarea()" class="bg-emerald-600 text-white px-4 py-2 rounded">Crear Tarea</button>
    </div><div class="space-y-2">`;
    for (let t of tareas || []) {
      html += `<div class="bg-white p-4 rounded-lg shadow flex justify-between"><div><h3 class="font-bold">${t.titulo}</h3><p class="text-sm">${t.descripcion}</p><p class="text-xs text-amber-600">📅 ${t.fecha_limite}</p></div><button onclick="eliminarTarea('${t.id}')" class="text-red-500">Eliminar</button></div>`;
    }
    html += `</div>`;
    document.getElementById('adminContent').innerHTML = html;
  }
  window.crearTarea = async () => {
    const titulo = document.getElementById('tareaTitulo').value.trim();
    if (!titulo) return alert("Título requerido");
    await supabase.from('tareas_aula').insert({ id: crypto.randomUUID(), titulo, descripcion: document.getElementById('tareaDesc').value, fecha_limite: document.getElementById('tareaFecha').value, iglesia_id: currentIglesiaId });
    alert("Tarea creada");
    renderTareas();
  };
  window.eliminarTarea = async (id) => {
    if (confirm("¿Eliminar tarea?")) await supabase.from('tareas_aula').delete().eq('id', id);
    renderTareas();
  };

  async function renderDevocionales() {
    const hoy = new Date().toISOString().slice(0,10);
    const { data: devoHoy } = await supabase.from('devocionales').select('*').eq('fecha', hoy).eq('iglesia_id', currentIglesiaId).single();
    let html = `<div class="bg-white p-4 rounded-lg shadow"><h2 class="font-bold">Devocional de Hoy (${hoy})</h2>
      <textarea id="devoVersiculo" class="border p-2 w-full mb-2 rounded" placeholder="Versículo">${devoHoy?.versiculo || ''}</textarea>
      <textarea id="devoReflexion" class="border p-2 w-full mb-2 rounded" placeholder="Reflexión">${devoHoy?.reflexion || ''}</textarea>
      <button onclick="guardarDevocional()" class="bg-emerald-600 text-white px-4 py-2 rounded">Guardar Devocional</button>
    </div>`;
    document.getElementById('adminContent').innerHTML = html;
  }
  window.guardarDevocional = async () => {
    const versiculo = document.getElementById('devoVersiculo').value.trim();
    const reflexion = document.getElementById('devoReflexion').value.trim();
    if (!versiculo || !reflexion) return alert("Completa ambos campos");
    const hoy = new Date().toISOString().slice(0,10);
    const { data: existe } = await supabase.from('devocionales').select('id').eq('fecha', hoy).eq('iglesia_id', currentIglesiaId).single();
    if (existe) await supabase.from('devocionales').update({ versiculo, reflexion }).eq('id', existe.id);
    else await supabase.from('devocionales').insert({ id: crypto.randomUUID(), versiculo, reflexion, fecha: hoy, iglesia_id: currentIglesiaId });
    alert("Devocional guardado");
    renderDevocionales();
  };
</script>
</body>
</html>
